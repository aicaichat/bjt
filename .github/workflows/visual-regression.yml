name: Visual Regression

on:
  pull_request:
    paths:
      - "bjt-front/bjt-product-system/frontend/src/**"
      - "bjt-front/bjt-product-system/frontend/e2e/**"
      - "bjt-front/bjt-product-system/frontend/playwright.config.ts"
      - "bjt-front/bjt-product-system/frontend/package.json"
      - "bjt-front/bjt-product-system/frontend/package-lock.json"
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bjt-front/bjt-product-system/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bjt-front/bjt-product-system/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build:skip-check

      - name: Design token audit
        run: npm run design:audit

      - name: Visual regression tests
        run: npm run test:visual

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: |
            bjt-front/bjt-product-system/frontend/playwright-report
            bjt-front/bjt-product-system/frontend/test-results
