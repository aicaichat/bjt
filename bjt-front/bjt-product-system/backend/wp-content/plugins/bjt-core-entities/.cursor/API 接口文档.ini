## 1. 通用说明

### 1.1 请求格式

所有API请求应采用HTTPS协议，请求头需包含:

```
Content-Type: application/json
Accept: application/json
```

对于需要认证的接口，请求头还需包含:

```
Authorization: Bearer {token}
```

### 1.2 响应格式

所有API响应采用统一JSON格式:

```json
{
  "success": true|false,
  "data": { ... },
  "message": "成功/错误信息（可选）",
  "code": 200 // 错误码（仅出错时返回）
}
```

### 1.3 错误处理

当API请求失败时，将返回包含错误信息的响应:

```json
{
  "success": false,
  "message": "错误描述",
  "code": 1001 // 错误码
}
```

### 1.4 分页处理

支持分页的接口采用以下参数:

- `page`: 页码，从1开始，默认为1
- `page_size`: 每页记录数，默认为10

分页响应格式:

```json
{
  "success": true,
  "data": {
    "items": [ ... 数据项数组 ... ],
    "total": 100,    // 总记录数
    "page": 1,       // 当前页码
    "page_size": 10, // 每页记录数
    "total_pages": 10 // 总页数
  }
}
```

### 1.5 多语言支持

大多数接口支持`lang`参数选择语言，可选值:
- `zh` - 中文(默认)
- `en` - 英文

### 1.6 区域支持

价格和库存相关接口支持`region`参数选择区域，可选值:
- `CN` - 中国(默认)
- `EU` - 欧洲
- `NA` - 北美
- `AU` - 澳洲

