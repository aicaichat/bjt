**路径参数**:
- `productLineId`: 产品线ID

**查询参数**:
- `region` (可选): 区域代码，默认根据用户设置
- `lang` (可选): 语言，默认`zh`
- `page` (可选): 页码，默认1
- `page_size` (可选): 每页数量，默认10
