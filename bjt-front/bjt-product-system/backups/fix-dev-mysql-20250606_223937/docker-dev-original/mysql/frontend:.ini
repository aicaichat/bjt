frontend:
  build:
    context: ../../frontend        # 构建上下文，指向前端代码目录
    dockerfile: Dockerfile.dev     # 使用的Dockerfile名称
  ports:
    - "5173:5173"                  # 端口映射，宿主机5173端口映射到容器的5173端口
  volumes:
    - ../../frontend:/app:z        # 挂载前端代码到容器内的/app目录
    - frontend-node-modules:/app/node_modules:z  # 使用命名卷存储node_modules
  environment:
    - NODE_ENV=development         # 设置环境变量
    - VITE_API_URL=http://localhost:8080
  healthcheck:                      # 健康检查配置
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173 || exit 1"]
    interval: 30s                   # 检查间隔
    timeout: 10s                    # 检查超时
    retries: 3                      # 失败尝试次数
    start_period: 20s               # 启动宽限期