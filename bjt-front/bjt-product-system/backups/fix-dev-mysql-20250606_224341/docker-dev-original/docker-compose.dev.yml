# 开发环境 - 独立端口配置
# 避免与生产环境的端口冲突
version: '3.8'

services:
  # 前端开发服务器
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    image: bjt-dev-frontend:latest
    ports:
      - "5173:5173"  # 开发专用端口
    networks:
      dev_bjt_network:
        aliases:
          - frontend.dev
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8081/wp-json/bjt/v1  # 指向开发后端
      - VITE_USE_MOCK_DATA=false
      - VITE_USE_PROXY=false  # 直接访问，不使用代理
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WordPress开发服务器
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    ports:
      - "8081:80"  # 开发专用端口，避免与生产环境8080冲突
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: bjt_dev_password123
      WORDPRESS_DB_NAME: bjt_dev
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATE: ''
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8081');
        define('WP_SITEURL', 'http://localhost:8081');
        define('WP_CONTENT_URL', 'http://localhost:8081/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', 'bjt-dev-secret-key-2023');
        // 开发环境CORS设置
        header('Access-Control-Allow-Origin: http://localhost:5173');
        header('Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS');
        header('Access-Control-Allow-Headers: Content-Type, Authorization');
        header('Access-Control-Allow-Credentials: true');
      WORDPRESS_DEBUG: 1
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - ../../frontend:/var/www/html/frontend
      # 开发环境独立的上传目录
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    env_file:
      - ../../.env.development
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      dev_bjt_network:
        aliases:
          - wordpress.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL数据库 - 开发环境
  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"  # 开发专用端口，避免与生产环境3307冲突
    environment:
      MYSQL_ROOT_PASSWORD: bjt_dev_password123
      MYSQL_DATABASE: bjt_dev
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: bjt_dev_password123
    volumes:
      - dev_mysql_data:/var/lib/mysql  # 独立的数据volume
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
      - ../../generated_sql_imports/test_users.sql:/docker-entrypoint-initdb.d/04-test-users.sql:ro
    env_file:
      - ../../.env.development
    networks:
      dev_bjt_network:
        aliases:
          - mysql.dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理 - 开发环境（可选）
  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"  # 开发环境nginx端口
    volumes:
      - ../../nginx/conf.d/development.conf:/etc/nginx/conf.d/default.conf
      - ../../backend:/var/www/html:ro
      - ../../plugins:/var/www/html/wp-content/plugins:ro
      - ../../frontend:/var/www/html/frontend:ro
      - ../../frontend/public/uploads:/usr/share/nginx/html/uploads:rw
    depends_on:
      - wordpress
    networks:
      dev_bjt_network:
        aliases:
          - nginx.dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# 独立的开发环境网络
networks:
  dev_bjt_network:
    driver: bridge
    name: bjt_dev_network  # 明确指定网络名称

# 独立的开发环境volumes
volumes:
  dev_mysql_data:
    name: bjt_dev_mysql_data 