将现在的API集成到前端frontend

要将前端从mock API切换到新开发的WordPress REST API，需要进行以下修改：


1. API配置和认证
- 创建 `src/config/api.js` 文件，配置API基础URL和认证信息：


为前端页面设立测试API




1. 在frontend/src/api目录下创建api.js文件
2. 在api.js文件中定义API接口
3. 在frontend/src/components目录下创建components.js文件
4. 在components.js文件中使用API接口
5. 在frontend/src/App.js文件中引入components.js文件