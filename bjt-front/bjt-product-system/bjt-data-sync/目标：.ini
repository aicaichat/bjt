Okay, this is a significant task: transitioning the entire frontend from mock data to live API data, and then also creating data synchronization scripts between the mock data and the database.
Let's break this down.
Understanding the Goal
The primary goal is to make the frontend consume real data from the WordPress backend API (http://localhost:8080/wp-json/bjt/v1). The secondary goals involve understanding the mock data system and creating scripts to move data between the mock data files and the live database. This implies a need for a development/testing workflow where mock data can be used as a baseline or for offline development, and then potentially synced with the live database.
Design Plan & Approach
Phase 1: Full Transition to Live API Data
Environment Configuration:
Standardize all services (machinesService, consumablesService, accessoriesService, sparePartsService, etc.) to use a single, clear mechanism for toggling mock data. The current VITE_USE_MOCK_DATA (used by machinesService) and VITE_USE_MOCK (used by consumablesService via appConfig.ts) should be unified. Let's prefer VITE_USE_MOCK_DATA.
Ensure all environment files (.env.development, .env.production, .env.production.mock) correctly set VITE_API_BASE_URL and the unified mock data flag.
Service Layer Refactoring (if necessary):
Review each data service in frontend/src/services/.
Ensure each service has a clear switch (based on the unified mock data flag) to call either its mock data function or its API-calling function (e.g., apiGetMachines vs mockGetMachines).
Ensure all API-calling functions use the HttpServiceInstance (from apiService.ts) for consistency in request/response handling, error handling, and token management, rather than direct axios calls (like consumablesService currently does). This will also help with the RawAPIResponse vs unwrapped data consistency we worked on earlier.
Verify that the data types returned by the API-calling functions match what the page components expect. This includes ensuring the backend API actually returns data in the RawAPIResponse<T> envelope if HttpService is to unwrap it, or that the service function correctly transforms the direct API response if HttpService is bypassed.
Component Layer Adjustments:
Review all page components (e.g., Machines/index.tsx, Consumables/index.tsx, SpareParts/index.tsx, Accessories/index.tsx) that fetch data.
Ensure they correctly handle the data structure returned by the (now potentially refactored) service methods. If HttpService is used everywhere and unwraps response.data, then checks like response.success in components should be removed, as errors will be caught in the catch block.
API Endpoint Verification:
Cross-reference the API calls made by the frontend services with the API 接口文档.ini.
Verify that all required endpoints exist, accept the correct parameters (names and types), and return data in the expected format. Pay special attention to filtering, pagination, lang, and region parameters.
Identify any discrepancies between frontend expectations and backend API capabilities.
Phase 2: Understanding Mock Data & Creating Sync Scripts
Mock Data Analysis:
Thoroughly review how mock data is structured and used in each service (e.g., frontend/src/services/machinesService.ts has mockMachines, consumablesService.ts has mockConsumables).
Identify the source files for this mock data (likely embedded directly in the service files or imported from dedicated mock data files in .ts or .json format).
Database vs. Mock Data Comparison:
Compare the structure of mock data objects with the database schema defined in init.sql and the other .sql files.
Note any differences in field names, data types, or data relationships. This will be crucial for writing accurate import/export scripts.
For example, mock data might use id: "MEY-001" while the database uses an auto-incrementing integer id. Dates might be strings in mock data but datetime in SQL.
Scripting - DB to Mock Data:
Strategy: This script would connect to your MySQL database, query the relevant tables (e.g., wp_bjt_product_lines, wp_bjt_host_models, wp_bjt_consumables, etc.), transform the queried data into the JavaScript/TypeScript object format used by your frontend mock services, and then write this data out to the appropriate .ts or .json mock data files.
Technology: A Node.js script would be suitable for this, using a MySQL connector (like mysql2) and file system (fs) modules.
Transformation Logic: This is the most complex part. It needs to:
Map database table columns to mock data object properties.
Handle relationships (e.g., fetching related accessories for a machine).
Format data as needed (e.g., dates, booleans).
Reconstruct nested structures present in mock data if the DB stores them in a flatter or relational way.
Scripting - Mock Data to DB:
Strategy: This script would read the frontend mock data files (.ts or .json), parse the JavaScript/TypeScript objects, transform them into a format suitable for SQL INSERT or UPDATE statements, and then execute these statements against your MySQL database.
Technology: Node.js again.
Transformation Logic:
Map mock data object properties to database table columns.
Handle potential data type mismatches.
Determine whether to INSERT new records or UPDATE existing ones (idempotency is key). This might involve checking if a record with a certain unique key (e.g., part_number, model) already exists.
Carefully manage auto-incrementing IDs in the database if the mock data contains its own IDs that aren't meant to be the primary keys.
Insert data in the correct order to satisfy foreign key constraints if they were to be enforced (though your init.sql doesn't explicitly define them, it's good practice).
