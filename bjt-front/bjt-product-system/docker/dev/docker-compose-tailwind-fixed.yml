# 产品管理系统开发环境配置 - Tailwind CSS 修复版

services:
  # 前端开发服务器 - 修复Tailwind CSS配置
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=development
        - TAILWIND_MODE=watch
    image: dev-frontend-tailwind-fixed:latest
    ports:
      - "5173:5173"
    networks:
      bjt_network:
        aliases:
          - frontend.local
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      # 确保PostCSS配置不被覆盖
      - ../../frontend/postcss.config.js:/app/postcss.config.js:ro
      - ../../frontend/tailwind.config.js:/app/tailwind.config.js:ro
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - VITE_API_URL=/wp-json/bjt/v1
      - VITE_USE_MOCK_DATA=false
      - VITE_USE_PROXY=true
      - VITE_HOST=0.0.0.0
      - TAILWIND_MODE=watch
      - POSTCSS_CONFIG_PATH=/app/postcss.config.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    command: >
      sh -c "
        echo '🔧 修复Tailwind CSS配置...' &&
        npm install --save-dev @tailwindcss/postcss tailwindcss@latest postcss@latest autoprefixer@latest postcss-import@latest postcss-nested@latest postcss-preset-env@latest &&
        echo '✅ Tailwind CSS配置修复完成' &&
        npm run dev -- --host 0.0.0.0
      "

  # WordPress开发服务器（使用官方 WordPress 镜像）
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: bjt_product
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATE: ''
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_CONTENT_URL', 'http://localhost:8080/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', 'bjt-secret-key-2023');
      WORDPRESS_DEBUG: 1
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - ../../frontend:/var/www/html/frontend
      # 添加uploads目录挂载 - 解决文件上传问题
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    env_file:
      - ../../.env.development
    depends_on:
      - mysql
    networks:
      bjt_network:
        aliases:
          - wordpress.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bjt_product
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
      - ./mysql/test_users.sql:/docker-entrypoint-initdb.d/04-test-users.sql:ro
    env_file:
      - ../../.env.development
    networks:
      bjt_network:
        aliases:
          - mysql.local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../../docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ../../backend:/var/www/html:ro
      - ../../plugins:/var/www/html/wp-content/plugins:ro
      - ../../frontend:/var/www/html/frontend:ro
      # 添加uploads目录挂载 - 支持静态文件访问
      - ../../frontend/public/uploads:/usr/share/nginx/html/uploads:rw
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    depends_on:
      - frontend
      - wordpress
    networks:
      bjt_network:
        aliases:
          - nginx.local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data: 