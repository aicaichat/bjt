# 本地开发环境配置 - 仅后端服务
# 前端使用 npm dev 运行，后端使用 Docker

services:
  # WordPress开发服务器
  wordpress:
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: bjtpassword123
      WORDPRESS_DB_NAME: bjt
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATE: ''
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_CONTENT_URL', 'http://localhost:8080/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', 'bjt-secret-key-2023');
        // 允许跨域请求（用于前端开发）
        header('Access-Control-Allow-Origin: http://localhost:5173');
        header('Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS');
        header('Access-Control-Allow-Headers: Content-Type, Authorization');
        header('Access-Control-Allow-Credentials: true');
      WORDPRESS_DEBUG: 1
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - ../../frontend:/var/www/html/frontend
      # 上传文件目录挂载 - 解决文件权限和访问问题
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    env_file:
      - ../../.env.development
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      bjt_network:
        aliases:
          - wordpress.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bjtpassword123
      MYSQL_DATABASE: bjt
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: bjtpassword123
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
      - ../../generated_sql_imports/test_users.sql:/docker-entrypoint-initdb.d/04-test-users.sql:ro
    env_file:
      - ../../.env.development
    networks:
      bjt_network:
        aliases:
          - mysql.local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data: 