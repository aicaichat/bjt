# BJT产品管理系统 - 远程IP部署配置
version: '3.8'

services:
  # 前端开发服务器（远程访问版本）
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
      args:
        - VITE_API_URL=http://${SERVER_IP}/wp-json/bjt/v1
    ports:
      - "5173:5173"
    networks:
      - bjt_network
    volumes:
      - ../../frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://${SERVER_IP}/wp-json/bjt/v1
      - VITE_HOST=0.0.0.0
    env_file:
      - ../../.env.remote-ip
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WordPress开发服务器（远程访问版本）
  wordpress:
    build:
      context: ../../docker/wordpress
      dockerfile: Dockerfile.dev
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_CHARSET: utf8mb4
      WORDPRESS_DB_COLLATE: ''
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://${SERVER_IP}');
        define('WP_SITEURL', 'http://${SERVER_IP}');
        define('WP_CONTENT_URL', 'http://${SERVER_IP}/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', '${JWT_AUTH_SECRET_KEY}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FORCE_SSL_ADMIN', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_EDIT', false);
      WORDPRESS_DEBUG: 1
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - wordpress_logs:/var/log
    env_file:
      - ../../.env.remote-ip
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-admin/admin-ajax.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL数据库
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_logs:/var/log/mysql
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
    env_file:
      - ../../.env.remote-ip
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bjt_network
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE} --max-connections=${MYSQL_MAX_CONNECTIONS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理（远程访问版本）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../../docker/nginx/conf.d/remote-ip.conf:/etc/nginx/conf.d/default.conf
      - ../../backend:/var/www/html:ro
      - ../../plugins:/var/www/html/wp-content/plugins:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - wordpress
    environment:
      - SERVER_IP=${SERVER_IP}
    env_file:
      - ../../.env.remote-ip
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data:
  mysql_logs:
  wordpress_uploads:
  wordpress_logs:
  nginx_logs: 