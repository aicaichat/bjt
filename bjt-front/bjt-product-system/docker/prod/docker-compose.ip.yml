version: '3.8'

services:
  # Nginx负载均衡和反向代理（IP地址版本）
  nginx:
    build:
      context: ../../
      dockerfile: docker/nginx/Dockerfile.ip
      args:
        - VITE_API_URL=http://${DOMAIN_NAME}/wp-json/bjt/v1
    ports:
      - "80:80"
      # 不开放443端口，因为没有SSL证书
    volumes:
      - ../../nginx/conf.d:/etc/nginx/conf.d
      - ../../backend:/var/www/html:ro
      - ../../plugins:/var/www/html/wp-content/plugins:ro
      - ../../frontend:/var/www/html/frontend:ro
      # 添加uploads目录挂载 - 支持静态文件访问
      - ../../frontend/public/uploads:/usr/share/nginx/html/uploads:rw
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    depends_on:
      - wordpress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - USE_SSL=${USE_SSL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # WordPress应用服务器
  wordpress:
    build:
      context: ../../docker/wordpress
      dockerfile: Dockerfile.prod
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_CHARSET: ${WORDPRESS_DB_CHARSET}
      WORDPRESS_DB_COLLATE: ${WORDPRESS_DB_COLLATE}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
      JWT_AUTH_SECRET_KEY: ${JWT_AUTH_SECRET_KEY}
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('WP_CONTENT_URL', '${WP_HOME}/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', '${JWT_AUTH_SECRET_KEY}');
        define('WP_DEBUG', false);
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('FORCE_SSL_ADMIN', false);
        define('WP_CACHE', true);
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - ../../frontend:/var/www/html/frontend
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - wordpress_cache:/var/www/html/wp-content/cache
      # 添加uploads目录挂载 - 解决文件上传和访问问题
      - ../../frontend/public/uploads:/var/www/html/frontend/public/uploads:rw
    env_file:
      - ../../.env.production.ip
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/wp-admin/admin-ajax.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_backup:/backup
      - ../../docker/mysql/conf.d:/etc/mysql/conf.d
      # 挂载初始化SQL文件
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M
    env_file:
      - ../../.env.production.ip
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # 数据库初始化服务
  db-init:
    image: mysql:8.0
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../../docker/mysql/init-db.sh:/usr/local/bin/init-db.sh:ro
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/_设备.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/_耗材.sql:ro
    command: ["/usr/local/bin/init-db.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bjt_network
    restart: "no"  # 只运行一次

  # 数据库备份服务
  mysql-backup:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_backup:/backup
      - ../../scripts/backup.sh:/backup.sh
    command: >
      sh -c "
        echo '${BACKUP_SCHEDULE} /backup.sh' > /etc/crontabs/root &&
        crond -f
      "
    depends_on:
      - mysql
    networks:
      - bjt_network
    restart: unless-stopped

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  mysql_backup:
    driver: local
  wordpress_uploads:
    driver: local
  wordpress_cache:
    driver: local 