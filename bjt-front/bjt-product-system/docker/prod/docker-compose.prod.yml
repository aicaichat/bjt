version: '3.8'

services:
  # Nginx负载均衡和反向代理（包含前端应用）
  nginx:
    build:
      context: ../../
      dockerfile: docker/nginx/Dockerfile.prod
      args:
        - VITE_API_URL=/wp-json/bjt/v1
    env_file:
      - ../../.env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/ssl:/etc/nginx/ssl
      - ../../backend:/var/www/html:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ../../plugins:/var/www/html/wp-content/plugins:ro
      - ../../frontend:/var/www/html/frontend:ro
      # 上传文件目录挂载 - 统一使用volume避免权限冲突
      - uploads_data:/usr/share/nginx/html/uploads:rw
    depends_on:
      - wordpress
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # WordPress应用服务器
  wordpress:
    build:
      context: ../../docker/wordpress
      dockerfile: Dockerfile.prod
    env_file:
      - ../../.env.production
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_CHARSET: ${WORDPRESS_DB_CHARSET}
      WORDPRESS_DB_COLLATE: ${WORDPRESS_DB_COLLATE}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
      JWT_AUTH_SECRET_KEY: ${JWT_AUTH_SECRET_KEY}
      WP_HOME: ${WP_HOME}
      WP_SITEURL: ${WP_SITEURL}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME}');
        define('WP_SITEURL', '${WP_SITEURL}');
        define('WP_CONTENT_URL', '${WP_HOME}/wp-content');
        define('WP_CONTENT_DIR', '/var/www/html/wp-content');
        define('JWT_AUTH_SECRET_KEY', '${JWT_AUTH_SECRET_KEY}');
        define('FORCE_SSL_ADMIN', true);
        define('WP_CACHE', true);
    volumes:
      - ../../backend:/var/www/html
      - ../../plugins:/var/www/html/wp-content/plugins
      - ../../frontend:/var/www/html/frontend
      - uploads_data:/var/www/html/wp-content/uploads
      - wordpress_cache:/var/www/html/wp-content/cache
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # MySQL数据库
  mysql:
    image: mysql:8.0
    env_file:
      - ../../.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_backup:/backup
      - ../../docker/mysql/conf.d:/etc/mysql/conf.d
      # 挂载初始化SQL文件（生产环境，移除测试数据）
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/02-devices.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/03-consumables.sql:ro
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # 数据库初始化服务
  db-init:
    image: alpine:3.18
    env_file:
      - ../../.env.production
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ../../docker/mysql/init-db.sh:/usr/local/bin/init-db.sh:ro
      - ../../docker/dev/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../../generated_sql_imports/_设备.sql:/docker-entrypoint-initdb.d/_设备.sql:ro
      - ../../generated_sql_imports/_耗材.sql:/docker-entrypoint-initdb.d/_耗材.sql:ro
    command: [/usr/local/bin/init-db.sh]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bjt_network
    restart: "no"  # 只运行一次

  # 数据库备份服务
  mysql-backup:
    image: alpine:3.18
    env_file:
      - ../../.env.production
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
    volumes:
      - mysql_backup:/backup
      - ../../scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "
        apk add --no-cache mysql-client bash &&
        mkdir -p /etc/crontabs &&
        echo '${BACKUP_SCHEDULE:-0 2 * * *} /backup.sh' > /etc/crontabs/root &&
        crond -f -l 2
      "
    depends_on:
      - mysql
    networks:
      - bjt_network
    restart: unless-stopped

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  mysql_backup:
    driver: local
  uploads_data:
    driver: local
  wordpress_cache:
    driver: local 
