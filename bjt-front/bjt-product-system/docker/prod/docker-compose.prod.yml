version: '3.8'

services:
  # Nginx负载均衡
  nginx:
    image: nginx:1.20
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/conf.d:/etc/nginx/conf.d
      - ../../nginx/ssl:/etc/nginx/ssl
      - ../../frontend/build:/usr/share/nginx/html
    depends_on:
      - wordpress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WordPress应用服务器
  wordpress:
    image: wordpress:php8.0
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: bjt_product
    volumes:
      - ../../backend:/var/www/html
      - ../../backend/plugins:/var/www/html/wp-content/plugins
      - wordpress_uploads:/var/www/html/wp-content/uploads
    env_file:
      - ../../.env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL数据库
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bjt_product
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_backup:/backup
    command: --default-authentication-plugin=mysql_native_password
    env_file:
      - ../../.env.production
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bjt_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bjt_network:
    driver: bridge

volumes:
  mysql_data:
  mysql_backup:
  wordpress_uploads: 