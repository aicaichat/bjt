<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # 启用重写模块
    RewriteEngine On

    # WordPress永久链接支持
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # 安全头部
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    </Directory>

    # 映射 /uploads/ 到 frontend/public/uploads/ 目录
    # 这样当Nginx代理请求到WordPress时，Apache可以正确找到文件
    Alias /uploads /var/www/html/frontend/public/uploads
    
    <Directory /var/www/html/frontend/public/uploads>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        
        # 允许访问图片和其他静态文件
        <FilesMatch "\.(jpg|jpeg|png|gif|svg|pdf|doc|docx|xls|xlsx|zip|rar|txt)$">
            Require all granted
        </FilesMatch>
        
        # 禁止执行脚本
        <FilesMatch "\.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # 隐藏敏感文件
    <Files "wp-config.php">
        Require all denied
    </Files>
    
    <Files ".htaccess">
        Require all denied
    </Files>
    
    <FilesMatch "\.(log|sql|bak)$">
        Require all denied
    </FilesMatch>

    # 缓存静态文件
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
        Header append Cache-Control "public"
    </LocationMatch>

    # 压缩
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>

    # 日志配置
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost> 