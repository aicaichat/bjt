<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Shapes Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .debug-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .shape-item {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .shape-item img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        .shape-item h3 {
            margin: 10px 0 5px 0;
            font-size: 16px;
        }
        .shape-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
        .api-test {
            background: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .error {
            background: #ffe8e8;
            color: #d00;
        }
        .success {
            background: #e8f5e8;
            color: #080;
        }
    </style>
</head>
<body>
    <h1>🔍 Shapes Data Debug</h1>
    
    <div class="debug-section">
        <h2>📊 API Test Results</h2>
        <div id="api-results"></div>
    </div>

    <div class="debug-section">
        <h2>🎨 Shapes Data</h2>
        <div id="shapes-container"></div>
    </div>

    <script>
        console.log('🚀 Starting shapes debug...');
        
        // Test API endpoint
        async function testAPI() {
            const resultsDiv = document.getElementById('api-results');
            
            try {
                // Test if we can fetch consumables data
                const response = await fetch('/api/consumables?page=1&pageSize=1');
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="api-test success">
                        ✅ API Response: ${response.status}<br>
                        📦 Data keys: ${Object.keys(data).join(', ')}<br>
                        🔍 Filter options available: ${data.filterOptions ? 'Yes' : 'No'}<br>
                        🎨 Shapes count: ${data.filterOptions?.shapes?.length || 0}
                    </div>
                `;
                
                if (data.filterOptions?.shapes) {
                    displayShapes(data.filterOptions.shapes);
                }
                
            } catch (error) {
                console.error('❌ API test failed:', error);
                resultsDiv.innerHTML = `
                    <div class="api-test error">
                        ❌ API Error: ${error.message}<br>
                        🔧 This might be expected if using mock data
                    </div>
                `;
                
                // Fallback: try to load mock data directly
                loadMockData();
            }
        }
        
        // Load mock data as fallback
        function loadMockData() {
            // Simulate the mock data structure
            const mockShapes = [
                { id: 'MEX', name: '气泡枕', name_en: 'Pillow', image_url: '/images/MEX/values/MEX.png' },
                { id: 'MEY', name: '开口气泡枕', name_en: 'Precut Air Pillow', image_url: '/images/MEX/values/MEX.png' },
                { id: 'MFB', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFB/values/MFB.png' },
                { id: 'MFC', name: '气枕膜', name_en: 'Tube', image_url: '/images/MFC/values/MFC.png' },
                { id: 'MFF', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFF/values/MFF.png' }
            ];
            
            document.getElementById('api-results').innerHTML += `
                <div class="api-test">
                    🔄 Using mock data fallback<br>
                    📊 Mock shapes loaded: ${mockShapes.length}
                </div>
            `;
            
            displayShapes(mockShapes);
        }
        
        // Display shapes
        function displayShapes(shapes) {
            const container = document.getElementById('shapes-container');
            
            if (!shapes || shapes.length === 0) {
                container.innerHTML = '<p>❌ No shapes data found</p>';
                return;
            }
            
            const shapesHTML = shapes.map(shape => `
                <div class="shape-item">
                    <img src="${shape.image_url}" alt="${shape.name}" 
                         onerror="this.style.border='2px solid red'; this.alt='❌ Image failed to load';">
                    <h3>${shape.name}</h3>
                    <p><strong>ID:</strong> ${shape.id}</p>
                    <p><strong>English:</strong> ${shape.name_en || 'N/A'}</p>
                    <p><strong>Image URL:</strong> ${shape.image_url}</p>
                </div>
            `).join('');
            
            container.innerHTML = `
                <div class="shape-grid">
                    ${shapesHTML}
                </div>
            `;
            
            console.log('✅ Shapes displayed:', shapes);
        }
        
        // Start the test
        testAPI();
    </script>
</body>
</html>
