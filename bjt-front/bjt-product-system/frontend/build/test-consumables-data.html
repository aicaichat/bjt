<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Consumables Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .shape-item {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
        }
        .shape-item img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .shape-item h4 {
            margin: 10px 0 5px 0;
            color: #333;
        }
        .shape-item p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: red;
            background: #ffe6e6;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            color: green;
            background: #e6ffe6;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .code {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            margin: 10px 0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Consumables Service Data Test</h1>
    
    <div class="test-section">
        <h2>测试结果</h2>
        <div id="test-results">
            <p>正在加载测试数据...</p>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Filter Options (Shapes)</h2>
        <div id="shapes-container">
            <p>正在加载形状数据...</p>
        </div>
    </div>
    
    <div class="test-section">
        <h2>Raw Data</h2>
        <div id="raw-data" class="code">
            正在加载原始数据...
        </div>
    </div>

    <script type="module">
        async function testConsumablesService() {
            try {
                // 模拟调用 consumablesService.getConsumables
                const testFilters = {
                    model: 'all',
                    shape: 'MEX',
                    material: 'hdpe',
                    page: 1,
                    page_size: 10,
                    region: 'cn',
                    lang: 'zh'
                };
                
                // 这里我们模拟服务返回的数据结构
                const mockResponse = {
                    items: [
                        {
                            id: '1',
                            name: 'MEX-RH30-13-20-13-L',
                            code: '90R01258',
                            model: 'MEX-RH30-13-20-13-L',
                            image_url: '/images/MEX/consumables/MEX.png',
                            specs: {
                                material: '30% HDPE',
                                shape: 'Pillow',
                                thickness: '13um',
                                width: '20cm',
                                length: '13cm'
                            }
                        }
                    ],
                    filterOptions: {
                        shapes: [
                            { id: 'MEX', name: '气泡枕', name_en: 'Pillow', image_url: '/images/MEX/values/MEX.png' },
                            { id: 'MEY', name: '开口气泡枕', name_en: 'Precut Air Pillow', image_url: '/images/MEX/values/MEX.png' },
                            { id: 'MFB', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFB/values/MFB.png' },
                            { id: 'MFC', name: '气枕膜', name_en: 'Tube', image_url: '/images/MFC/values/MFC.png' },
                            { id: 'MFF', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFF/values/MFF.png' }
                        ]
                    }
                };
                
                // 显示测试结果
                const resultsContainer = document.getElementById('test-results');
                resultsContainer.innerHTML = `
                    <div class="success">✅ 测试成功！</div>
                    <p><strong>返回的产品数量:</strong> ${mockResponse.items.length}</p>
                    <p><strong>形状选项数量:</strong> ${mockResponse.filterOptions.shapes.length}</p>
                    <p><strong>第一个产品图片路径:</strong> ${mockResponse.items[0].image_url}</p>
                `;
                
                // 显示形状数据
                const shapesContainer = document.getElementById('shapes-container');
                const shapesHtml = mockResponse.filterOptions.shapes.map(shape => `
                    <div class="shape-item">
                        <img src="${shape.image_url}" alt="${shape.name}" onerror="this.style.border='2px solid red'; this.alt='图片加载失败: ${shape.image_url}'">
                        <h4>${shape.name}</h4>
                        <p>${shape.name_en}</p>
                        <p><small>路径: ${shape.image_url}</small></p>
                    </div>
                `).join('');
                
                shapesContainer.innerHTML = `<div class="shape-grid">${shapesHtml}</div>`;
                
                // 显示原始数据
                const rawDataContainer = document.getElementById('raw-data');
                rawDataContainer.textContent = JSON.stringify(mockResponse, null, 2);
                
            } catch (error) {
                console.error('测试失败:', error);
                const resultsContainer = document.getElementById('test-results');
                resultsContainer.innerHTML = `
                    <div class="error">❌ 测试失败: ${error.message}</div>
                `;
            }
        }
        
        // 页面加载完成后运行测试
        document.addEventListener('DOMContentLoaded', testConsumablesService);
    </script>
</body>
</html>
