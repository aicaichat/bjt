<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="machineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="300" fill="url(#bgGradient)"/>
  
  <!-- 标题 -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">主机型号对比选择</text>
  
  <!-- 主机1: LA-E4S -->
  <g transform="translate(30, 50)">
    <rect width="160" height="200" rx="8" fill="url(#machineGradient)" stroke="#d1d5db" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">LA-E4S</text>
    <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">小型气垫机</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">110V/220V</text>
    
    <!-- 机器图标 -->
    <rect x="40" y="90" width="80" height="60" rx="4" fill="#e5e7eb" stroke="#d1d5db"/>
    <circle cx="60" cy="110" r="8" fill="#3b82f6"/>
    <circle cx="100" cy="110" r="8" fill="#3b82f6"/>
    <rect x="50" y="125" width="60" height="15" rx="2" fill="#9ca3af"/>
    
    <!-- 参数 -->
    <text x="80" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">功率: 2.2kW</text>
    <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">尺寸: 800×600×1200</text>
  </g>
  
  <!-- 主机2: LA-E6S -->
  <g transform="translate(220, 50)">
    <rect width="160" height="200" rx="8" fill="url(#machineGradient)" stroke="#d1d5db" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">LA-E6S</text>
    <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">中型气垫机</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">220V</text>
    
    <!-- 机器图标 -->
    <rect x="40" y="90" width="80" height="60" rx="4" fill="#e5e7eb" stroke="#d1d5db"/>
    <circle cx="60" cy="110" r="8" fill="#10b981"/>
    <circle cx="100" cy="110" r="8" fill="#10b981"/>
    <rect x="50" y="125" width="60" height="15" rx="2" fill="#9ca3af"/>
    
    <!-- 参数 -->
    <text x="80" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">功率: 3.7kW</text>
    <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">尺寸: 1000×800×1400</text>
  </g>
  
  <!-- 主机3: LA-E8S -->
  <g transform="translate(410, 50)">
    <rect width="160" height="200" rx="8" fill="url(#machineGradient)" stroke="#d1d5db" stroke-width="2"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">LA-E8S</text>
    <text x="80" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">大型气垫机</text>
    <text x="80" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">220V</text>
    
    <!-- 机器图标 -->
    <rect x="40" y="90" width="80" height="60" rx="4" fill="#e5e7eb" stroke="#d1d5db"/>
    <circle cx="60" cy="110" r="8" fill="#f59e0b"/>
    <circle cx="100" cy="110" r="8" fill="#f59e0b"/>
    <rect x="50" y="125" width="60" height="15" rx="2" fill="#9ca3af"/>
    
    <!-- 参数 -->
    <text x="80" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">功率: 5.5kW</text>
    <text x="80" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">尺寸: 1200×1000×1600</text>
  </g>
  
  <!-- 交互提示 -->
  <g transform="translate(500, 20)">
    <rect width="80" height="30" rx="6" fill="rgba(255,255,255,0.9)" stroke="#dbeafe" stroke-width="1"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">💡 点击选择</text>
  </g>
  
  <!-- 分隔线 -->
  <line x1="200" y1="50" x2="200" y2="250" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="390" y1="50" x2="390" y2="250" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
</svg> 