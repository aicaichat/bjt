<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumables Service Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .shape-item {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .shape-item img {
            max-width: 100%;
            height: 80px;
            object-fit: contain;
            border: 1px solid #eee;
            padding: 5px;
            background: #fafafa;
        }
        .code {
            background: #007bff;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 5px;
            display: inline-block;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Consumables Service Test - 耗材服务测试</h1>
    
    <div class="test-section">
        <h2>Service Options Test - 服务选项测试</h2>
        <p>测试 consumablesService.getConsumableOptions() 返回的数据：</p>
        <div id="service-test-result">
            <p>正在加载...</p>
        </div>
    </div>

    <div class="test-section">
        <h2>Shape Images from Service - 来自服务的形状图片</h2>
        <div id="shapes-container">
            <p>正在加载形状数据...</p>
        </div>
    </div>

    <script type="module">
        // 模拟 consumablesService 的 getConsumableOptions 方法
        const mockConsumableOptions = {
            shapes: [
                { id: 'MEX', name: '气泡枕', name_en: 'Pillow', image_url: '/images/MEX/values/MEX.png' },
                { id: 'MEY', name: '开口气泡枕', name_en: 'Precut Air Pillow', image_url: '/images/MEX/values/MEX.png' },
                { id: 'MFB', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFB/values/MFB.png' },
                { id: 'MFC', name: '气枕膜', name_en: 'Tube', image_url: '/images/MFC/values/MFC.png' },
                { id: 'MFF', name: '葫芦膜', name_en: 'Bubble', image_url: '/images/MFF/values/MFF.png' }
            ]
        };

        // 显示服务选项数据
        function displayServiceOptions() {
            const resultContainer = document.getElementById('service-test-result');
            resultContainer.innerHTML = `
                <h3>✅ 服务选项数据结构：</h3>
                <pre>${JSON.stringify(mockConsumableOptions, null, 2)}</pre>
            `;
        }

        // 显示形状图片
        function displayShapes() {
            const shapesContainer = document.getElementById('shapes-container');
            const shapesHtml = mockConsumableOptions.shapes.map(shape => `
                <div class="shape-item">
                    <div class="code">${shape.id}</div>
                    <img src="${shape.image_url}" alt="${shape.name}" 
                         onerror="this.style.border='2px solid red'; this.alt='图片加载失败: ${shape.image_url}';">
                    <h3>${shape.name}</h3>
                    <p>${shape.name_en}</p>
                    <small>${shape.image_url}</small>
                </div>
            `).join('');

            shapesContainer.innerHTML = `
                <div class="shape-grid">
                    ${shapesHtml}
                </div>
            `;
        }

        // 测试图片加载
        function testImageLoading() {
            const images = mockConsumableOptions.shapes.map(shape => shape.image_url);
            const uniqueImages = [...new Set(images)];
            
            console.log('Testing image loading for:', uniqueImages);
            
            uniqueImages.forEach(imageUrl => {
                const img = new Image();
                img.onload = () => {
                    console.log(`✅ Image loaded successfully: ${imageUrl}`);
                };
                img.onerror = () => {
                    console.error(`❌ Failed to load image: ${imageUrl}`);
                };
                img.src = imageUrl;
            });
        }

        // 初始化测试
        function init() {
            displayServiceOptions();
            displayShapes();
            testImageLoading();
        }

        // 页面加载完成后执行测试
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
