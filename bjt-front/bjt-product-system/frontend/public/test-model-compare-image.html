<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机型号对比图片功能测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        
        .compare-section {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 24px auto;
            position: relative;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            background: #fff;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            padding: 16px;
        }
        
        .compare-title {
            text-align: center;
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #374151;
        }
        
        .image-container {
            position: relative;
            display: inline-block;
        }
        
        .compare-image {
            width: 100%;
            max-width: 600px;
            display: block;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .click-area {
            position: absolute;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            transition: all 0.2s ease;
            z-index: 2;
        }
        
        .click-area:hover {
            border-color: #60a5fa;
            background-color: rgba(96, 165, 250, 0.1);
        }
        
        .click-area.selected {
            border: 3px solid #3b82f6;
            box-shadow: 0 0 0 4px #dbeafe;
            background-color: rgba(59, 130, 246, 0.1);
        }
        
        .model-name {
            position: absolute;
            bottom: 8px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #374151;
            font-weight: 700;
            font-size: 14px;
            text-shadow: 0 1px 4px #fff;
            pointer-events: none;
            user-select: none;
            padding: 4px;
            background-color: rgba(255,255,255,0.9);
            border-radius: 4px;
            margin: 0 4px;
        }
        
        .selected .model-name {
            color: #2563eb;
        }
        
        .selected-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            background-color: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .interaction-hint {
            position: absolute;
            right: 12px;
            top: 12px;
            background: rgba(255,255,255,0.9);
            color: #3b82f6;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 500;
            z-index: 3;
            border: 1px solid #dbeafe;
        }
        
        .status-display {
            margin-top: 20px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        
        .status-title {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        
        .status-content {
            color: #6b7280;
            font-size: 14px;
        }
        
        .demo-buttons {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .demo-button {
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        
        .demo-button:hover {
            background: #2563eb;
        }
        
        .demo-button.secondary {
            background: #6b7280;
        }
        
        .demo-button.secondary:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>主机型号对比图片功能测试</h1>
        <p>这个页面演示了主机型号对比图片的交互功能，用户可以通过点击图片中的不同区域来选择对应的主机型号。</p>
        
        <div class="compare-section">
            <div class="compare-title">主机型号对比选择</div>
            
            <div class="image-container">
                <!-- 使用SVG作为示例图片 -->
                <svg class="compare-image" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
                    <rect width="600" height="300" fill="#f3f4f6"/>
                    <text x="300" y="30" text-anchor="middle" font-family="Arial" font-size="18" fill="#374151">主机型号对比图</text>
                    
                    <!-- 主机1 -->
                    <rect x="20" y="60" width="160" height="200" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2"/>
                    <text x="100" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">LA-E4S</text>
                    <text x="100" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">110V/220V</text>
                    <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">小型气垫机</text>
                    
                    <!-- 主机2 -->
                    <rect x="200" y="60" width="160" height="200" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2"/>
                    <text x="280" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">LA-E6S</text>
                    <text x="280" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">220V</text>
                    <text x="280" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">中型气垫机</text>
                    
                    <!-- 主机3 -->
                    <rect x="380" y="60" width="160" height="200" fill="#e5e7eb" stroke="#d1d5db" stroke-width="2"/>
                    <text x="460" y="100" text-anchor="middle" font-family="Arial" font-size="14" fill="#374151">LA-E8S</text>
                    <text x="460" y="120" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">220V</text>
                    <text x="460" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="#6b7280">大型气垫机</text>
                </svg>
                
                <!-- 点击区域1 -->
                <div class="click-area" data-model="LA-E4S" style="left: 20px; top: 60px; width: 160px; height: 200px;">
                    <div class="model-name">LA-E4S</div>
                </div>
                
                <!-- 点击区域2 -->
                <div class="click-area" data-model="LA-E6S" style="left: 200px; top: 60px; width: 160px; height: 200px;">
                    <div class="model-name">LA-E6S</div>
                </div>
                
                <!-- 点击区域3 -->
                <div class="click-area" data-model="LA-E8S" style="left: 380px; top: 60px; width: 160px; height: 200px;">
                    <div class="model-name">LA-E8S</div>
                </div>
                
                <div class="interaction-hint">💡 点击图片区域选择主机型号</div>
            </div>
        </div>
        
        <div class="status-display">
            <div class="status-title">选择状态</div>
            <div class="status-content" id="status-content">未选择任何主机型号</div>
        </div>
        
        <div class="demo-buttons">
            <button class="demo-button" onclick="selectModel('LA-E4S')">选择 LA-E4S</button>
            <button class="demo-button" onclick="selectModel('LA-E6S')">选择 LA-E6S</button>
            <button class="demo-button" onclick="selectModel('LA-E8S')">选择 LA-E8S</button>
            <button class="demo-button secondary" onclick="clearSelection()">清除选择</button>
        </div>
    </div>

    <script>
        let selectedModel = null;
        
        // 为所有点击区域添加事件监听
        document.querySelectorAll('.click-area').forEach(area => {
            area.addEventListener('click', function() {
                const model = this.getAttribute('data-model');
                selectModel(model);
            });
        });
        
        function selectModel(model) {
            // 清除之前的选择
            document.querySelectorAll('.click-area').forEach(area => {
                area.classList.remove('selected');
                const indicator = area.querySelector('.selected-indicator');
                if (indicator) indicator.remove();
            });
            
            // 设置新的选择
            const targetArea = document.querySelector(`[data-model="${model}"]`);
            if (targetArea) {
                targetArea.classList.add('selected');
                
                // 添加选中指示器
                const indicator = document.createElement('div');
                indicator.className = 'selected-indicator';
                indicator.textContent = '✓';
                targetArea.appendChild(indicator);
            }
            
            selectedModel = model;
            updateStatus();
        }
        
        function clearSelection() {
            document.querySelectorAll('.click-area').forEach(area => {
                area.classList.remove('selected');
                const indicator = area.querySelector('.selected-indicator');
                if (indicator) indicator.remove();
            });
            
            selectedModel = null;
            updateStatus();
        }
        
        function updateStatus() {
            const statusElement = document.getElementById('status-content');
            if (selectedModel) {
                statusElement.textContent = `已选择主机型号: ${selectedModel}`;
                statusElement.style.color = '#059669';
            } else {
                statusElement.textContent = '未选择任何主机型号';
                statusElement.style.color = '#6b7280';
            }
        }
        
        // 初始化状态
        updateStatus();
    </script>
</body>
</html>
