<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整订单流程测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 10px 5px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .flow-step { margin: 10px 0; padding: 10px; border-left: 4px solid #ddd; background: #f9f9f9; }
        .flow-step.active { border-left-color: #007bff; background: #e3f2fd; }
        .flow-step.success { border-left-color: #28a745; background: #d4edda; }
        .flow-step.error { border-left-color: #dc3545; background: #f8d7da; }
        .result-data { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 3px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>BJT完整订单流程测试</h1>
    <p class="info">测试从订单创建到PO页面的完整流程</p>

    <div class="test-section">
        <h2>流程步骤</h2>
        <div id="step-1" class="flow-step">
            <strong>步骤1:</strong> 检查后端API连接
        </div>
        <div id="step-2" class="flow-step">
            <strong>步骤2:</strong> 模拟创建订单
        </div>
        <div id="step-3" class="flow-step">
            <strong>步骤3:</strong> 验证订单号格式
        </div>
        <div id="step-4" class="flow-step">
            <strong>步骤4:</strong> 测试订单数据传递
        </div>
        <div id="step-5" class="flow-step">
            <strong>步骤5:</strong> 验证PO页面兼容性
        </div>
    </div>

    <div class="test-section">
        <h2>测试控制</h2>
        <button onclick="runCompleteTest()" id="test-btn">开始完整流程测试</button>
        <button onclick="testSingleOrder()" id="single-test-btn">测试单个订单创建</button>
        <button onclick="clearResults()">清除结果</button>
    </div>

    <div class="test-section">
        <h2>测试结果</h2>
        <div id="test-results"></div>
    </div>

    <script>
        let currentStep = 0;
        const steps = ['step-1', 'step-2', 'step-3', 'step-4', 'step-5'];
        
        function updateStepStatus(stepIndex, status) {
            const stepElement = document.getElementById(steps[stepIndex]);
            stepElement.className = `flow-step ${status}`;
        }
        
        function setActiveStep(stepIndex) {
            steps.forEach((stepId, index) => {
                const element = document.getElementById(stepId);
                if (index < stepIndex) {
                    element.className = 'flow-step success';
                } else if (index === stepIndex) {
                    element.className = 'flow-step active';
                } else {
                    element.className = 'flow-step';
                }
            });
        }
        
        function logResult(message, isError = false) {
            const resultsDiv = document.getElementById('test-results');
            const timestamp = new Date().toLocaleTimeString();
            const className = isError ? 'error' : 'success';
            resultsDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
            steps.forEach(stepId => {
                document.getElementById(stepId).className = 'flow-step';
            });
            currentStep = 0;
        }
        
        async function runCompleteTest() {
            clearResults();
            document.getElementById('test-btn').disabled = true;
            
            try {
                setActiveStep(0);
                logResult('开始检查后端API连接...');
                
                const apiResponse = await fetch('/wp-json/bjt/v1/orders');
                if (!apiResponse.ok) {
                    throw new Error(`API连接失败: ${apiResponse.status}`);
                }
                
                const apiData = await apiResponse.json();
                updateStepStatus(0, 'success');
                logResult(`✓ 后端API连接成功，当前订单数量: ${apiData.data ? apiData.data.length : 0}`);
                
                setActiveStep(1);
                logResult('开始创建测试订单...');
                
                const orderData = {
                    user_id: 14,
                    total_amount: 299.99,
                    currency: 'CNY',
                    region: 'CN',
                    status: 'pending_payment',
                    payment_method: 'bank_transfer',
                    shipping_address: {
                        name: '测试用户',
                        phone: '13800138000',
                        address: '测试地址123号'
                    },
                    billing_address: {
                        name: '测试用户',
                        phone: '13800138000',
                        address: '测试地址123号'
                    },
                    items: [
                        {
                            target_type: 'machine',
                            target_id: 5,
                            quantity: 1,
                            price: 299.99,
                            item_type: 'machine',
                            item_id: '1231313131313',
                            item_name: 'LA E5S test - 完整流程测试',
                            currency: 'CNY',
                            spec: 'Business Class Air Cushion Pillow & Bubble System,AC220V'
                        }
                    ]
                };

                const createResponse = await fetch('/wp-json/bjt/v1/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                if (!createResponse.ok) {
                    const errorText = await createResponse.text();
                    throw new Error(`订单创建失败: ${createResponse.status} - ${errorText}`);
                }

                const createResult = await createResponse.json();
                if (!createResult.success) {
                    throw new Error(`订单创建失败: ${createResult.message}`);
                }

                const newOrder = createResult.data;
                updateStepStatus(1, 'success');
                logResult(`✓ 订单创建成功: ${newOrder.order_number} (ID: ${newOrder.id})`);
                
                setActiveStep(2);
                logResult('验证订单号格式...');
                
                const orderNumber = newOrder.order_number;
                const poFormatRegex = /^PO-\d{12}-[A-Z0-9]{6}$/;
                const ordFormatRegex = /^ORD-\d{8}-[A-Z0-9]{6}$/;
                
                let formatValid = false;
                let formatType = '';
                
                if (poFormatRegex.test(orderNumber)) {
                    formatValid = true;
                    formatType = 'PO格式 (新标准)';
                } else if (ordFormatRegex.test(orderNumber)) {
                    formatValid = true;
                    formatType = 'ORD格式 (旧标准)';
                }
                
                if (formatValid) {
                    updateStepStatus(2, 'success');
                    logResult(`✓ 订单号格式验证通过: ${orderNumber} (${formatType})`);
                } else {
                    updateStepStatus(2, 'error');
                    logResult(`✗ 订单号格式不符合标准: ${orderNumber}`, true);
                    return;
                }
                
                setActiveStep(3);
                logResult('测试订单数据传递格式...');
                
                const poData = {
                    orderNumber: newOrder.order_number,
                    orderItems: newOrder.items.map(item => ({
                        id: item.item_id || Math.random().toString(36).substr(2, 9),
                        code: item.item_id,
                        sku: item.item_id,
                        name: item.item_name,
                        quantity: item.quantity,
                        price: parseFloat(item.price),
                        specs: { spec: item.spec },
                        type: item.item_type,
                        category: item.category || '1'
                    })),
                    customerInfo: {
                        contactName: newOrder.shipping_address?.name || '',
                        phone: newOrder.shipping_address?.phone || '',
                        address: newOrder.shipping_address?.address || ''
                    },
                    summary: {
                        subtotal: parseFloat(newOrder.total_amount),
                        shipping: 0,
                        tax: parseFloat(newOrder.total_amount) * 0.13,
                        total: parseFloat(newOrder.total_amount) * 1.13,
                        currency: newOrder.currency
                    }
                };
                
                updateStepStatus(3, 'success');
                logResult(`✓ 订单数据传递格式构建成功，包含 ${poData.orderItems.length} 个商品`);
                
                setActiveStep(4);
                logResult('验证PO页面兼容性...');
                
                const requiredFields = ['orderNumber', 'orderItems', 'customerInfo', 'summary'];
                const missingFields = requiredFields.filter(field => !poData[field]);
                
                if (missingFields.length > 0) {
                    updateStepStatus(4, 'error');
                    logResult(`✗ PO页面数据缺少必要字段: ${missingFields.join(', ')}`, true);
                    return;
                }
                
                const requiredItemFields = ['id', 'name', 'quantity', 'price'];
                const itemsValid = poData.orderItems.every(item => 
                    requiredItemFields.every(field => item[field] !== undefined)
                );
                
                if (!itemsValid) {
                    updateStepStatus(4, 'error');
                    logResult('✗ 订单项目数据不完整', true);
                    return;
                }
                
                updateStepStatus(4, 'success');
                logResult('✓ PO页面兼容性验证通过');
                
                logResult('🎉 完整流程测试成功完成！');
                logResult(`📋 测试订单: ${newOrder.order_number}`);
                logResult(`💰 订单金额: ¥${newOrder.total_amount}`);
                logResult(`📦 商品数量: ${newOrder.items.length}`);
                
            } catch (error) {
                updateStepStatus(currentStep, 'error');
                logResult(`✗ 测试失败: ${error.message}`, true);
                console.error('Complete test failed:', error);
            } finally {
                document.getElementById('test-btn').disabled = false;
            }
        }
        
        async function testSingleOrder() {
            document.getElementById('single-test-btn').disabled = true;
            logResult('开始单个订单创建测试...');
            
            try {
                const orderData = {
                    user_id: 14,
                    total_amount: 150.00,
                    currency: 'CNY',
                    region: 'CN',
                    status: 'pending_payment',
                    payment_method: 'bank_transfer',
                    shipping_address: {
                        name: '单测用户',
                        phone: '13900139000',
                        address: '单测地址456号'
                    },
                    billing_address: {
                        name: '单测用户',
                        phone: '13900139000',
                        address: '单测地址456号'
                    },
                    items: [
                        {
                            target_type: 'accessory',
                            target_id: 19,
                            quantity: 1,
                            price: 150.00,
                            item_type: 'accessory',
                            item_id: '60A06006',
                            item_name: 'EC2007 移动网篮 - 单测',
                            currency: 'CNY',
                            spec: 'EC2007 Movable Basket'
                        }
                    ]
                };

                const response = await fetch('/wp-json/bjt/v1/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        const order = result.data;
                        logResult(`✓ 单个订单创建成功: ${order.order_number} (¥${order.total_amount})`);
                    } else {
                        logResult(`✗ 订单创建失败: ${result.message}`, true);
                    }
                } else {
                    const errorText = await response.text();
                    logResult(`✗ API调用失败: ${response.status} - ${errorText}`, true);
                }
            } catch (error) {
                logResult(`✗ 单测失败: ${error.message}`, true);
            } finally {
                document.getElementById('single-test-btn').disabled = false;
            }
        }
    </script>
</body>
</html>
