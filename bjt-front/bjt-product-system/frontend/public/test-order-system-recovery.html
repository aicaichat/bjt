<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单系统恢复测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 10px 5px; padding: 10px 15px; }
        .order-data { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .test-result.success { background: #d4edda; border: 1px solid #c3e6cb; }
        .test-result.error { background: #f8d7da; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>BJT订单系统恢复测试</h1>
    <p class="info">测试Docker重启后订单系统的完整性和数据一致性</p>

    <div class="test-section">
        <h2>1. 后端API连接测试</h2>
        <button onclick="testBackendConnection()">测试后端连接</button>
        <div id="backend-result"></div>
    </div>

    <div class="test-section">
        <h2>2. 订单列表获取测试</h2>
        <button onclick="testOrderList()">获取订单列表</button>
        <div id="orderlist-result"></div>
    </div>

    <div class="test-section">
        <h2>3. 订单号格式验证</h2>
        <button onclick="testOrderNumberFormat()">验证订单号格式</button>
        <div id="ordernumber-result"></div>
    </div>

    <div class="test-section">
        <h2>4. 创建新订单测试</h2>
        <button onclick="testCreateOrder()">创建测试订单</button>
        <div id="create-order-result"></div>
    </div>

    <div class="test-section">
        <h2>5. 订单数据一致性测试</h2>
        <button onclick="testDataConsistency()">测试数据一致性</button>
        <div id="consistency-result"></div>
    </div>

    <script>
        // 后端API连接测试
        async function testBackendConnection() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '<p class="info">正在测试后端连接...</p>';
            
            try {
                const response = await fetch('/wp-json/bjt/v1/orders');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="test-result success">
                            <p class="success">✓ 后端API连接成功</p>
                            <p>返回订单数量: ${data.data ? data.data.length : 0}</p>
                        </div>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <p class="error">✗ 后端连接失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 订单列表获取测试
        async function testOrderList() {
            const resultDiv = document.getElementById('orderlist-result');
            resultDiv.innerHTML = '<p class="info">正在获取订单列表...</p>';
            
            try {
                const response = await fetch('/wp-json/bjt/v1/orders');
                const data = await response.json();
                
                if (data.success && data.data) {
                    const orders = data.data.slice(0, 5);
                    let orderHtml = '<div class="test-result success">';
                    orderHtml += '<p class="success">✓ 订单列表获取成功</p>';
                    orderHtml += '<h4>最新5个订单:</h4>';
                    
                    orders.forEach(order => {
                        orderHtml += `
                            <div class="order-data">
                                <strong>订单号:</strong> ${order.order_number}<br>
                                <strong>ID:</strong> ${order.id}<br>
                                <strong>金额:</strong> ${order.total_amount} ${order.currency}<br>
                                <strong>状态:</strong> ${order.status}<br>
                                <strong>创建时间:</strong> ${order.created_at}
                            </div>
                        `;
                    });
                    
                    orderHtml += '</div>';
                    resultDiv.innerHTML = orderHtml;
                } else {
                    throw new Error('API返回数据格式错误');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <p class="error">✗ 获取订单列表失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 订单号格式验证
        async function testOrderNumberFormat() {
            const resultDiv = document.getElementById('ordernumber-result');
            resultDiv.innerHTML = '<p class="info">正在验证订单号格式...</p>';
            
            try {
                const response = await fetch('/wp-json/bjt/v1/orders');
                const data = await response.json();
                
                if (data.success && data.data) {
                    const orders = data.data;
                    let formatResults = [];
                    
                    const poFormatRegex = /^PO-\d{12}-[A-Z0-9]{6}$/;
                    const ordFormatRegex = /^ORD-\d{8}-[A-Z0-9]{6}$/;
                    
                    orders.forEach(order => {
                        const orderNumber = order.order_number;
                        let formatType = 'unknown';
                        let isValid = false;
                        
                        if (poFormatRegex.test(orderNumber)) {
                            formatType = 'PO格式 (新)';
                            isValid = true;
                        } else if (ordFormatRegex.test(orderNumber)) {
                            formatType = 'ORD格式 (旧)';
                            isValid = true;
                        }
                        
                        formatResults.push({
                            id: order.id,
                            orderNumber: orderNumber,
                            formatType: formatType,
                            isValid: isValid,
                            createdAt: order.created_at
                        });
                    });
                    
                    const poCount = formatResults.filter(r => r.formatType === 'PO格式 (新)').length;
                    const ordCount = formatResults.filter(r => r.formatType === 'ORD格式 (旧)').length;
                    const invalidCount = formatResults.filter(r => !r.isValid).length;
                    
                    let resultHtml = '<div class="test-result success">';
                    resultHtml += '<p class="success">✓ 订单号格式验证完成</p>';
                    resultHtml += `<p><strong>统计结果:</strong></p>`;
                    resultHtml += `<p>PO格式 (新): ${poCount} 个</p>`;
                    resultHtml += `<p>ORD格式 (旧): ${ordCount} 个</p>`;
                    resultHtml += `<p>无效格式: ${invalidCount} 个</p>`;
                    
                    resultHtml += '<h4>最新10个订单格式详情:</h4>';
                    formatResults.slice(0, 10).forEach(result => {
                        const statusClass = result.isValid ? 'success' : 'error';
                        resultHtml += `
                            <div class="order-data">
                                <span class="${statusClass}">
                                    ${result.isValid ? '✓' : '✗'} ${result.orderNumber}
                                </span>
                                <br><small>格式: ${result.formatType} | 创建: ${result.createdAt}</small>
                            </div>
                        `;
                    });
                    
                    resultHtml += '</div>';
                    resultDiv.innerHTML = resultHtml;
                } else {
                    throw new Error('API返回数据格式错误');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <p class="error">✗ 订单号格式验证失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 创建新订单测试
        async function testCreateOrder() {
            const resultDiv = document.getElementById('create-order-result');
            resultDiv.innerHTML = '<p class="info">正在创建测试订单...</p>';
            
            try {
                // 模拟订单数据
                const orderData = {
                    user_id: 14,
                    total_amount: 100.00,
                    currency: 'CNY',
                    region: 'CN',
                    status: 'pending_payment',
                    payment_method: 'bank_transfer',
                    shipping_address: {
                        name: '测试用户',
                        phone: '13800138000',
                        address: '测试地址'
                    },
                    billing_address: {
                        name: '测试用户',
                        phone: '13800138000',
                        address: '测试地址'
                    },
                    items: [
                        {
                            target_type: 'machine',
                            target_id: 5,
                            quantity: 1,
                            price: 100.00,
                            item_type: 'machine',
                            item_id: '1231313131313',
                            item_name: 'LA E5S test',
                            currency: 'CNY',
                            spec: 'Business Class Air Cushion Pillow & Bubble System,AC220V'
                        }
                    ]
                };

                const response = await fetch('/wp-json/bjt/v1/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        const order = result.data;
                        resultDiv.innerHTML = `
                            <div class="test-result success">
                                <p class="success">✓ 测试订单创建成功</p>
                                <div class="order-data">
                                    <strong>订单号:</strong> ${order.order_number}<br>
                                    <strong>订单ID:</strong> ${order.id}<br>
                                    <strong>金额:</strong> ${order.total_amount} ${order.currency}<br>
                                    <strong>状态:</strong> ${order.status}<br>
                                    <strong>创建时间:</strong> ${order.created_at}
                                </div>
                                <p class="info">注意: 这是真实的订单创建，已保存到数据库</p>
                            </div>
                        `;
                    } else {
                        throw new Error(result.message || '订单创建失败');
                    }
                } else {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <p class="error">✗ 创建订单失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 数据一致性测试
        async function testDataConsistency() {
            const resultDiv = document.getElementById('consistency-result');
            resultDiv.innerHTML = '<p class="info">正在测试数据一致性...</p>';
            
            try {
                // 获取最新订单
                const response = await fetch('/wp-json/bjt/v1/orders');
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    const latestOrder = data.data[0];
                    
                    // 获取单个订单详情
                    const detailResponse = await fetch(`/wp-json/bjt/v1/orders/${latestOrder.id}`);
                    const detailData = await detailResponse.json();
                    
                    if (detailData.success) {
                        const orderDetail = detailData.data;
                        
                        // 比较数据一致性
                        const consistencyChecks = [
                            {
                                field: 'order_number',
                                listValue: latestOrder.order_number,
                                detailValue: orderDetail.order_number,
                                match: latestOrder.order_number === orderDetail.order_number
                            },
                            {
                                field: 'total_amount',
                                listValue: latestOrder.total_amount,
                                detailValue: orderDetail.total_amount,
                                match: latestOrder.total_amount === orderDetail.total_amount
                            },
                            {
                                field: 'status',
                                listValue: latestOrder.status,
                                detailValue: orderDetail.status,
                                match: latestOrder.status === orderDetail.status
                            },
                            {
                                field: 'items_count',
                                listValue: latestOrder.items ? latestOrder.items.length : 0,
                                detailValue: orderDetail.items ? orderDetail.items.length : 0,
                                match: (latestOrder.items ? latestOrder.items.length : 0) === (orderDetail.items ? orderDetail.items.length : 0)
                            }
                        ];
                        
                        const allMatch = consistencyChecks.every(check => check.match);
                        
                        let resultHtml = `<div class="test-result ${allMatch ? 'success' : 'error'}">`;
                        resultHtml += `<p class="${allMatch ? 'success' : 'error'}">`;
                        resultHtml += allMatch ? '✓ 数据一致性检查通过' : '✗ 发现数据不一致';
                        resultHtml += '</p>';
                        
                        resultHtml += '<h4>一致性检查详情:</h4>';
                        consistencyChecks.forEach(check => {
                            const statusClass = check.match ? 'success' : 'error';
                            const statusIcon = check.match ? '✓' : '✗';
                            resultHtml += `
                                <div class="order-data">
                                    <span class="${statusClass}">${statusIcon} ${check.field}</span><br>
                                    <small>列表值: ${check.listValue}</small><br>
                                    <small>详情值: ${check.detailValue}</small>
                                </div>
                            `;
                        });
                        
                        resultHtml += '</div>';
                        resultDiv.innerHTML = resultHtml;
                    } else {
                        throw new Error('获取订单详情失败');
                    }
                } else {
                    throw new Error('没有找到订单数据');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <p class="error">✗ 数据一致性测试失败: ${error.message}</p>
                    </div>
                `;
            }
        }

        // 页面加载时自动测试后端连接
        document.addEventListener('DOMContentLoaded', function() {
            testBackendConnection();
        });
    </script>
</body>
</html>
