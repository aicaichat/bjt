<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Shapes API Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .shape-item {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .shape-item img {
            width: 80px;
            height: 60px;
            object-fit: contain;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }
        .shape-item h3 {
            margin: 10px 0 5px 0;
            font-size: 16px;
        }
        .shape-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #666;
        }
        .api-test {
            background: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .error {
            background: #ffe8e8;
            color: #d00;
        }
        .success {
            background: #e8f5e8;
            color: #080;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🔧 Shapes API Fix Test</h1>
    
    <div class="test-section">
        <h2>📊 API Test Results</h2>
        <div id="api-results"></div>
    </div>

    <div class="test-section">
        <h2>🎨 Shapes Data</h2>
        <div id="shapes-container"></div>
    </div>

    <div class="test-section">
        <h2>🔍 Raw API Response</h2>
        <pre id="raw-response"></pre>
    </div>

    <script>
        console.log('🚀 Starting shapes API fix test...');
        
        // Test API endpoint
        async function testAPI() {
            const resultsDiv = document.getElementById('api-results');
            const rawResponseDiv = document.getElementById('raw-response');
            
            try {
                // Test consumables API to get filter options
                console.log('📡 Fetching consumables data...');
                const response = await fetch('/api/consumables?page=1&pageSize=5');
                const data = await response.json();
                
                console.log('✅ API Response received:', data);
                rawResponseDiv.textContent = JSON.stringify(data, null, 2);
                
                resultsDiv.innerHTML = `
                    <div class="api-test success">
                        ✅ API Response: ${response.status}<br>
                        📦 Data structure: ${data.success ? 'Success' : 'Failed'}<br>
                        🔍 Filter options available: ${data.data?.filterOptions ? 'Yes' : 'No'}<br>
                        🎨 Shapes count: ${data.data?.filterOptions?.shapes?.length || 0}
                    </div>
                `;
                
                if (data.data?.filterOptions?.shapes) {
                    displayShapes(data.data.filterOptions.shapes);
                    
                    // Test each shape for required fields
                    testShapeFields(data.data.filterOptions.shapes);
                } else {
                    resultsDiv.innerHTML += `
                        <div class="api-test error">
                            ❌ No shapes data found in filterOptions
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ API test failed:', error);
                resultsDiv.innerHTML = `
                    <div class="api-test error">
                        ❌ API Error: ${error.message}<br>
                        🔧 Check console for details
                    </div>
                `;
                rawResponseDiv.textContent = `Error: ${error.message}`;
            }
        }
        
        // Test shape fields
        function testShapeFields(shapes) {
            const resultsDiv = document.getElementById('api-results');
            
            let hasId = 0;
            let hasImageUrl = 0;
            let hasName = 0;
            let hasCode = 0;
            
            shapes.forEach(shape => {
                if (shape.id) hasId++;
                if (shape.image_url) hasImageUrl++;
                if (shape.name) hasName++;
                if (shape.code) hasCode++;
            });
            
            const total = shapes.length;
            
            resultsDiv.innerHTML += `
                <div class="api-test ${hasId === total && hasImageUrl === total ? 'success' : 'warning'}">
                    📊 Field Analysis:<br>
                    🆔 ID field: ${hasId}/${total} (${hasId === total ? '✅' : '❌'})<br>
                    🖼️ Image URL: ${hasImageUrl}/${total} (${hasImageUrl === total ? '✅' : '❌'})<br>
                    📝 Name field: ${hasName}/${total} (${hasName === total ? '✅' : '❌'})<br>
                    🔤 Code field: ${hasCode}/${total} (${hasCode === total ? '✅' : '❌'})
                </div>
            `;
        }
        
        // Display shapes
        function displayShapes(shapes) {
            const container = document.getElementById('shapes-container');
            
            if (!shapes || shapes.length === 0) {
                container.innerHTML = '<p>❌ No shapes data found</p>';
                return;
            }
            
            const shapesHTML = shapes.map(shape => `
                <div class="shape-item">
                    <img src="${shape.image_url || '/images/placeholders/placeholder-80x60.svg'}" 
                         alt="${shape.name}" 
                         onerror="this.style.border='2px solid red'; this.alt='❌ Image failed';">
                    <h3>${shape.name || 'No Name'}</h3>
                    <p><strong>ID:</strong> ${shape.id || 'undefined'}</p>
                    <p><strong>Code:</strong> ${shape.code || 'undefined'}</p>
                    <p><strong>English:</strong> ${shape.name_en || 'N/A'}</p>
                    <p><strong>Image URL:</strong> ${shape.image_url ? '✅ Present' : '❌ Missing'}</p>
                    <p><strong>Sort Order:</strong> ${shape.sort_order || 'N/A'}</p>
                </div>
            `).join('');
            
            container.innerHTML = `
                <div class="shape-grid">
                    ${shapesHTML}
                </div>
            `;
            
            console.log('✅ Shapes displayed:', shapes);
        }
        
        // Start the test
        testAPI();
    </script>
</body>
</html>
