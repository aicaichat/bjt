<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简化调试 - BJT产品系统</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .test-button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .result-box {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .error-box {
            background: #ffebee;
            border: 1px solid #f44336;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 简化调试 - 运输信息处理</h1>
        
        <p>这个页面直接测试数据处理逻辑，不涉及复杂的路由和状态管理。</p>
        
        <button class="test-button" onclick="testDataProcessing()">测试数据处理逻辑</button>
        <button class="test-button" onclick="testActualAPI()">测试实际API数据</button>
        
        <div id="result"></div>
    </div>

    <script>
        // 直接测试数据处理逻辑
        function testDataProcessing() {
            const resultDiv = document.getElementById('result');
            
            console.log('🔧 [简化测试] 开始测试数据处理逻辑');
            
            // 模拟API返回的实际数据结构
            const apiData = {
                id: "20",
                order_number: "PO-202506231804-BC3049",
                shipping_address: {
                    name: "John Doe",
                    company: "Hangzhou Bingjia Tech. Co., Ltd.",
                    phone: "+86 13057101000",
                    address: "1818-2, Wenyixi Road, Hangzhou, Zhejiang Province, China"
                }
            };
            
            console.log('🔧 [简化测试] API数据:', apiData);
            
            // 模拟OrderList的提取逻辑
            const order = apiData;
            let extractedCustomerInfo = {
                companyName: 'Customer Company',
                contactName: 'Customer Contact',
                address: 'Customer Address',
                phone: 'Customer Phone',
                email: ''
            };
            
            let extractedShippingInfo = {
                address: 'Shipping Address',
                contactName: 'Shipping Contact',
                phone: 'Shipping Phone',
                notes: ''
            };
            
            // 关键步骤：从shipping_address提取信息
            console.log('🔧 [简化测试] 检查shipping_address:', order.shipping_address);
            
            if (order.shipping_address) {
                // 提取客户信息
                extractedCustomerInfo = {
                    companyName: order.shipping_address.company || extractedCustomerInfo.companyName,
                    contactName: order.shipping_address.name || extractedCustomerInfo.contactName,
                    address: order.shipping_address.address || extractedCustomerInfo.address,
                    phone: order.shipping_address.phone || extractedCustomerInfo.phone,
                    email: extractedCustomerInfo.email
                };
                
                // 提取运输信息
                extractedShippingInfo = {
                    address: order.shipping_address.address || extractedShippingInfo.address,
                    contactName: order.shipping_address.name || extractedShippingInfo.contactName,
                    phone: order.shipping_address.phone || extractedShippingInfo.phone,
                    notes: extractedShippingInfo.notes
                };
            }
            
            console.log('🔧 [简化测试] 提取后的客户信息:', extractedCustomerInfo);
            console.log('🔧 [简化测试] 提取后的运输信息:', extractedShippingInfo);
            
            // 模拟PO页面的standardizeShippingInfo函数
            function standardizeShippingInfo(shippingInfo) {
                console.log('🔧 [标准化] 输入的运输信息:', shippingInfo);
                console.log('🔧 [标准化] 信息类型:', typeof shippingInfo);
                
                if (!shippingInfo) {
                    console.log('🔧 [标准化] 运输信息为空');
                    return {
                        address: 'Shipping Address',
                        contactName: 'Shipping Contact',
                        phone: 'Shipping Phone',
                        notes: ''
                    };
                }
                
                if (typeof shippingInfo === 'object') {
                    console.log('🔧 [标准化] 处理对象格式');
                    console.log('🔧 [标准化] 对象字段:', Object.keys(shippingInfo));
                    
                    const result = {
                        address: shippingInfo.address || 'Shipping Address',
                        contactName: shippingInfo.name || shippingInfo.contactName || 'Shipping Contact',
                        phone: shippingInfo.phone || 'Shipping Phone',
                        notes: shippingInfo.notes || ''
                    };
                    
                    console.log('🔧 [标准化] 处理结果:', result);
                    console.log('🔧 [标准化] 字段映射详情:', {
                        '原始name': shippingInfo.name,
                        '原始contactName': shippingInfo.contactName,
                        '原始phone': shippingInfo.phone,
                        '原始address': shippingInfo.address,
                        '结果contactName': result.contactName,
                        '结果phone': result.phone,
                        '结果address': result.address
                    });
                    
                    return result;
                }
                
                console.log('🔧 [标准化] 未知格式，使用默认值');
                return {
                    address: 'Shipping Address',
                    contactName: 'Shipping Contact',
                    phone: 'Shipping Phone',
                    notes: ''
                };
            }
            
            // 执行标准化
            const finalShippingInfo = standardizeShippingInfo(extractedShippingInfo);
            const finalCustomerInfo = extractedCustomerInfo;
            
            console.log('🔧 [简化测试] 最终运输信息:', finalShippingInfo);
            console.log('🔧 [简化测试] 最终客户信息:', finalCustomerInfo);
            
            // 检查结果
            const hasDefaults = 
                finalShippingInfo.address === 'Shipping Address' ||
                finalShippingInfo.contactName === 'Shipping Contact' ||
                finalShippingInfo.phone === 'Shipping Phone' ||
                finalCustomerInfo.companyName === 'Customer Company';
            
            resultDiv.innerHTML = `
<div class="${hasDefaults ? 'error-box' : 'result-box'}">
${hasDefaults ? '❌ 发现问题' : '✅ 测试通过'}

📡 原始API数据:
${JSON.stringify(apiData, null, 2)}

📋 OrderList提取结果:
客户信息: ${JSON.stringify(extractedCustomerInfo, null, 2)}
运输信息: ${JSON.stringify(extractedShippingInfo, null, 2)}

🔄 PO页面标准化结果:
客户信息: ${JSON.stringify(finalCustomerInfo, null, 2)}
运输信息: ${JSON.stringify(finalShippingInfo, null, 2)}

${hasDefaults ? `
🔍 问题分析:
- 仍然存在默认值
- 数据处理逻辑需要检查
` : `
✅ 数据处理正常:
- 所有字段都是真实数据
- 没有默认值
`}
</div>
            `;
        }
        
        // 测试实际API数据
        async function testActualAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div style="color: #666;">正在获取实际API数据...</div>';
            
            try {
                const response = await fetch('http://localhost:8080/wp-json/bjt/v1/orders/20');
                const apiResponse = await response.json();
                
                if (!apiResponse.success) {
                    throw new Error('API返回失败');
                }
                
                const apiData = apiResponse.data;
                console.log('🔧 [API测试] 实际API数据:', apiData);
                
                // 使用实际API数据重复测试逻辑
                const order = apiData;
                let extractedCustomerInfo = {
                    companyName: 'Customer Company',
                    contactName: 'Customer Contact',
                    address: 'Customer Address',
                    phone: 'Customer Phone',
                    email: ''
                };
                
                let extractedShippingInfo = {
                    address: 'Shipping Address',
                    contactName: 'Shipping Contact',
                    phone: 'Shipping Phone',
                    notes: ''
                };
                
                // 从shipping_address提取信息
                if (order.shipping_address) {
                    extractedCustomerInfo = {
                        companyName: order.shipping_address.company || extractedCustomerInfo.companyName,
                        contactName: order.shipping_address.name || extractedCustomerInfo.contactName,
                        address: order.shipping_address.address || extractedCustomerInfo.address,
                        phone: order.shipping_address.phone || extractedCustomerInfo.phone,
                        email: extractedCustomerInfo.email
                    };
                    
                    extractedShippingInfo = {
                        address: order.shipping_address.address || extractedShippingInfo.address,
                        contactName: order.shipping_address.name || extractedShippingInfo.contactName,
                        phone: order.shipping_address.phone || extractedShippingInfo.phone,
                        notes: extractedShippingInfo.notes
                    };
                }
                
                // 标准化处理
                function standardizeShippingInfo(shippingInfo) {
                    if (!shippingInfo || typeof shippingInfo !== 'object') {
                        return {
                            address: 'Shipping Address',
                            contactName: 'Shipping Contact',
                            phone: 'Shipping Phone',
                            notes: ''
                        };
                    }
                    
                    return {
                        address: shippingInfo.address || 'Shipping Address',
                        contactName: shippingInfo.name || shippingInfo.contactName || 'Shipping Contact',
                        phone: shippingInfo.phone || 'Shipping Phone',
                        notes: shippingInfo.notes || ''
                    };
                }
                
                const finalShippingInfo = standardizeShippingInfo(extractedShippingInfo);
                const finalCustomerInfo = extractedCustomerInfo;
                
                // 检查结果
                const hasDefaults = 
                    finalShippingInfo.address === 'Shipping Address' ||
                    finalShippingInfo.contactName === 'Shipping Contact' ||
                    finalShippingInfo.phone === 'Shipping Phone' ||
                    finalCustomerInfo.companyName === 'Customer Company';
                
                resultDiv.innerHTML = `
<div class="${hasDefaults ? 'error-box' : 'result-box'}">
${hasDefaults ? '❌ 实际API测试发现问题' : '✅ 实际API测试通过'}

📡 实际API返回:
订单号: ${apiData.order_number}
运输信息: ${JSON.stringify(apiData.shipping_address, null, 2)}

📋 数据提取过程:
1. 原始shipping_address: ${JSON.stringify(order.shipping_address, null, 2)}
2. 提取的客户信息: ${JSON.stringify(extractedCustomerInfo, null, 2)}
3. 提取的运输信息: ${JSON.stringify(extractedShippingInfo, null, 2)}
4. 标准化后运输信息: ${JSON.stringify(finalShippingInfo, null, 2)}

🎯 最终结果:
- 客户公司: ${finalCustomerInfo.companyName}
- 客户联系人: ${finalCustomerInfo.contactName}
- 运输联系人: ${finalShippingInfo.contactName}
- 运输电话: ${finalShippingInfo.phone}
- 运输地址: ${finalShippingInfo.address}

${hasDefaults ? `
❌ 问题诊断:
数据处理流程中仍然存在默认值，说明逻辑有问题。
请检查字段映射是否正确。
` : `
✅ 数据处理成功:
所有字段都显示真实数据，逻辑正常。
`}

🔧 下一步:
请直接访问 http://localhost:5173/order-list 并测试实际跳转效果。
</div>
                `;
                
            } catch (error) {
                console.error('🔧 [API测试] 失败:', error);
                resultDiv.innerHTML = `
<div class="error-box">
❌ API测试失败: ${error.message}

请检查:
1. 后端服务是否运行
2. 网络连接是否正常
3. 订单数据是否存在
</div>
                `;
            }
        }
    </script>
</body>
</html>
