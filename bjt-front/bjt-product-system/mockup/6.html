<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJT Machine Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
        }
        .modal-dialog {
            background-color: #fff;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 750px;
            max-width: 90%;
            animation: modalFadeIn 0.3s ease;
        }
        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e1e5eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            font-weight: 600;
            font-size: 18px;
            color: #1a3c70;
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #6c757d;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #e1e5eb;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-label {
            font-weight: 500;
            color: #495057;
            font-size: 14px;
        }
        .filter-input {
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            width: 180px;
        }
        .filter-input:focus {
            outline: none;
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77, 171, 247, 0.2);
        }
        .btn {
            padding: 8px 16px;
            background-color: #1a3c70;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #15305b;
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn-default {
            background-color: #6c757d;
        }
        .btn-default:hover {
            background-color: #5a6268;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #e1e5eb;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            position: sticky;
            top: 0;
            text-align: left;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border-bottom: 2px solid #e1e5eb;
            font-weight: 600;
            color: #495057;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e1e5eb;
            color: #212529;
        }
        tr:hover {
            background-color: #f8f9fa;
        }
        tr.selected {
            background-color: #e8f4ff;
        }
        .pagination {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
            gap: 5px;
        }
        .page-item {
            display: inline-block;
            min-width: 32px;
            height: 32px;
            text-align: center;
            line-height: 32px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .page-item:hover {
            background-color: #e9ecef;
            border-color: #dee2e6;
        }
        .page-item.active {
            background-color: #1a3c70;
            border-color: #1a3c70;
            color: white;
        }
        .radio-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="modal-dialog">
        <div class="modal-header">
            <h4 class="modal-title">新增关联关系</h4>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label">型号：</label>
                    <select class="filter-input" id="modelFilter">
                        <option value="">全部</option>
                        <option value="ET1003">ET1003</option>
                        <option value="FR8002">FR8002</option>
                        <option value="EC2009">EC2009</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">料号：</label>
                    <select class="filter-input" id="partFilter">
                        <option value="">全部</option>
                        <option value="13A00001">13A00001</option>
                        <option value="13A00002">13A00002</option>
                        <option value="13A00003">13A00003</option>
                    </select>
                </div>
                <button class="btn btn-default" id="resetFilterBtn">重置</button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;"></th>
                            <th style="width: 80px;">No</th>
                            <th>型号</th>
                            <th>料号</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="1">
                            </td>
                            <td>1</td>
                            <td>ET1003</td>
                            <td>13A00001</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="2">
                            </td>
                            <td>2</td>
                            <td>FR8002</td>
                            <td>13A00002</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="3">
                            </td>
                            <td>3</td>
                            <td>EC2009</td>
                            <td>13A00003</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="4">
                            </td>
                            <td>4</td>
                            <td>ET1003</td>
                            <td>13A00004</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="5">
                            </td>
                            <td>5</td>
                            <td>FR8002</td>
                            <td>13A00005</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="6">
                            </td>
                            <td>6</td>
                            <td>EC2009</td>
                            <td>13A00006</td>
                        </tr>
                        <tr>
                            <td style="text-align: center;">
                                <input type="radio" name="selectedItem" class="radio-input" value="7">
                            </td>
                            <td>7</td>
                            <td>ET1003</td>
                            <td>13A00007</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="pagination">
                <span class="page-item">«</span>
                <span class="page-item active">1</span>
                <span class="page-item">2</span>
                <span class="page-item">3</span>
                <span class="page-item">»</span>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-default" id="cancelBtn">取消</button>
            <button class="btn" id="confirmBtn">确定</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Radio button selection highlight
            const radioButtons = document.querySelectorAll('.radio-input');
            radioButtons.forEach(radio => {
                radio.addEventListener('change', function() {
                    // Remove selected class from all rows
                    document.querySelectorAll('tbody tr').forEach(row => {
                        row.classList.remove('selected');
                    });
                    
                    // Add selected class to the checked row
                    if (this.checked) {
                        this.closest('tr').classList.add('selected');
                    }
                });
            });
            
            // Row click selects the radio button
            const tableRows = document.querySelectorAll('tbody tr');
            tableRows.forEach(row => {
                row.addEventListener('click', function(e) {
                    // Don't trigger if clicking on the radio button itself
                    if (e.target.type !== 'radio') {
                        const radio = this.querySelector('.radio-input');
                        radio.checked = true;
                        
                        // Trigger the change event to update styling
                        const event = new Event('change');
                        radio.dispatchEvent(event);
                    }
                });
            });
            
            // Filter functionality
            const modelFilter = document.getElementById('modelFilter');
            const partFilter = document.getElementById('partFilter');
            const resetFilterBtn = document.getElementById('resetFilterBtn');
            
            function applyFilters() {
                const modelValue = modelFilter.value.toLowerCase();
                const partValue = partFilter.value.toLowerCase();
                
                tableRows.forEach(row => {
                    const modelCell = row.cells[2].textContent.toLowerCase();
                    const partCell = row.cells[3].textContent.toLowerCase();
                    
                    const modelMatch = !modelValue || modelCell.includes(modelValue);
                    const partMatch = !partValue || partCell.includes(partValue);
                    
                    if (modelMatch && partMatch) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            }
            
            modelFilter.addEventListener('change', applyFilters);
            partFilter.addEventListener('change', applyFilters);
            
            resetFilterBtn.addEventListener('click', function() {
                modelFilter.value = '';
                partFilter.value = '';
                
                // Reset display of all rows
                tableRows.forEach(row => {
                    row.style.display = '';
                });
            });
            
            // Buttons functionality
            const closeBtn = document.querySelector('.modal-close');
            const cancelBtn = document.getElementById('cancelBtn');
            const confirmBtn = document.getElementById('confirmBtn');
            
            function closeModal() {
                document.querySelector('.modal-dialog').style.opacity = '0';
                setTimeout(() => {
                    document.body.style.backgroundColor = 'white';
                }, 300);
            }
            
            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            
            confirmBtn.addEventListener('click', function() {
                const selectedRadio = document.querySelector('.radio-input:checked');
                
                if (selectedRadio) {
                    console.log('Selected item:', selectedRadio.value);
                    alert('关联关系创建成功!');
                    closeModal();
                } else {
                    alert('请选择一个项目!');
                }
            });
            
            // Pagination functionality
            const pageItems = document.querySelectorAll('.pagination .page-item');
            pageItems.forEach(item => {
                item.addEventListener('click', function() {
                    if (this.classList.contains('active')) return;
                    
                    const currentActive = document.querySelector('.pagination .active');
                    if (currentActive) {
                        currentActive.classList.remove('active');
                    }
                    
                    if (this.textContent !== '«' && this.textContent !== '»') {
                        this.classList.add('active');
                    }
                    
                    // Pagination logic would go here
                });
            });
        });
    </script>
</body>
</html>
