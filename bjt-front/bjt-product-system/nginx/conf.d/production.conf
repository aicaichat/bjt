# 生产环境Nginx配置

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name bjt.nh.cool eorder.lockedair.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS主配置
server {
    listen 443 ssl http2;
    server_name bjt.nh.cool bjt.deepneed.com.cn eorder.lockedair.com;
    root /usr/share/nginx/html;
    index index.html index.php;

    # SSL配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头部
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # WordPress API路由
    location /wp-json/ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # 缓存API响应
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
    }

    # WordPress管理后台
    location ~ ^/(wp-admin|wp-login\.php) {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # PHP文件处理
    location ~ \.php$ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # WordPress内容目录
    location ~ ^/wp-content/ {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 静态文件缓存
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 上传文件目录 - 直接代理到WordPress处理路径映射
    # 修复：处理连字符/下划线和images子目录的路径差异
    location /uploads/ {
        # 重写URL路径，处理路径差异
        # 注意：重写后的路径应该保持 /uploads/ 前缀，让Apache的Alias处理
        
        # 1. spare-parts/images/xxx -> /uploads/spare_parts/xxx (连字符转下划线，移除images)
        rewrite ^/uploads/spare-parts/images/(.*)$ /uploads/spare_parts/$1 break;
        
        # 2. product-lines/images/xxx -> /uploads/product_lines/xxx (连字符转下划线，移除images)
        rewrite ^/uploads/product-lines/images/(.*)$ /uploads/product_lines/$1 break;
        
        # 3. product_lines/xxx -> /uploads/product_lines/xxx (保持原样，确保正确)
        rewrite ^/uploads/product_lines/(.*)$ /uploads/product_lines/$1 break;
        
        # 4. spare_parts/xxx -> /uploads/spare_parts/xxx (保持原样，确保正确)
        rewrite ^/uploads/spare_parts/(.*)$ /uploads/spare_parts/$1 break;
        
        # 5. 其他带images子目录的路径保持不变 (如 machines/images/, consumables/images/)
        # 这些路径在Apache的Alias下应该能正常工作
        
        # 6. 其他uploads路径保持不变，让Apache的Alias处理
        
        # 代理到WordPress
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        add_header X-Served-By "wordpress-proxy";
        
        # 静态文件缓存
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        
        # 安全设置 - 禁止执行脚本文件
        location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }

    # 静态文件缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    # 前端应用路由
    location / {
        try_files $uri $uri/ /index.html;
        
        # 前端文件缓存
        location ~* \.(html)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止访问敏感文件
    location ~* \.(sql|bak|backup|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 限制请求大小
    client_max_body_size 64M;
    
    # 超时设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
} 