<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品管理系统</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>产品管理系统</h1>
            <nav>
                <ul>
                    <li><a href="#" class="active" data-tab="products">产品列表</a></li>
                    <li><a href="#" data-tab="add-product">新增产品</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 产品列表 -->
        <section id="products" class="tab-content active">
            <div class="actions">
                <button id="addModelBtn" class="button button-primary">新增</button>
                <button class="button">导入</button>
                <button class="button">导出</button>
            </div>
            <table class="product-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>型号</th>
                        <th>名称</th>
                        <th>描述</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- 这里会通过JS动态填充 -->
                </tbody>
            </table>
        </section>

        <!-- 添加/编辑产品 -->
        <section id="add-product" class="tab-content">
            <form id="productForm">
                <div class="form-row">
                    <label for="model">型号</label>
                    <input type="text" id="model" name="model" required>
                </div>
                <div class="form-row">
                    <label for="title">名称</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-row">
                    <label for="description">描述</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                
                <div class="language-tabs">
                    <div class="tab-headers">
                        <button type="button" class="tab-btn active" data-lang="zh">中文</button>
                        <button type="button" class="tab-btn" data-lang="en">英文</button>
                        <button type="button" class="batch-translate">批量翻译</button>
                    </div>
                    <div class="tab-contents">
                        <div class="lang-content active" data-lang="zh">
                            <div class="form-row">
                                <label>中文名称</label>
                                <input type="text" name="title_zh">
                            </div>
                            <div class="form-row">
                                <label>中文描述</label>
                                <textarea name="description_zh"></textarea>
                            </div>
                        </div>
                        <div class="lang-content" data-lang="en">
                            <div class="form-row">
                                <label>英文名称</label>
                                <input type="text" name="title_en">
                            </div>
                            <div class="form-row">
                                <label>英文描述</label>
                                <textarea name="description_en"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <label>图片</label>
                    <div class="image-upload">
                        <div class="preview" id="imagePreview"></div>
                        <button type="button" id="uploadBtn" class="button">上传图片</button>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="button button-primary">保存</button>
                    <button type="button" class="button" id="cancelBtn">取消</button>
                </div>
            </form>
        </section>
        
        <!-- 编辑字段名称弹窗 -->
        <div id="editLabelModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>编辑字段名称</h2>
                <form id="labelForm">
                    <div class="form-row">
                        <label for="labelName">名称</label>
                        <input type="text" id="labelName" name="labelName">
                    </div>
                    <button type="submit" class="button button-primary">保存</button>
                </form>
            </div>
        </div>
        
        <!-- 操作成功提示 -->
        <div id="successToast" class="toast" style="display: none;">
            <div class="toast-content">
                <span class="toast-message">操作成功</span>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
