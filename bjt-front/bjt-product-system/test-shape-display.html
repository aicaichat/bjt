<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>形状多语言显示测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .spec-badge {
            display: inline-flex;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            margin: 5px;
            overflow: hidden;
        }
        .spec-label {
            background: #6c757d;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .spec-value {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
        }
        .language-toggle {
            text-align: center;
            margin-bottom: 20px;
        }
        .language-toggle button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .language-toggle button.active {
            background: #28a745;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
        }
        .product-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #495057;
        }
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .comparison-table th,
        .comparison-table td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
        }
        .comparison-table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .status-success { color: #28a745; }
        .status-warning { color: #ffc107; }
        .status-error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 BJT产品管理系统 - 形状多语言显示测试</h1>
        <p>验证形状字段在中文和英文环境下的正确显示</p>
    </div>

    <div class="language-toggle">
        <button id="zh-btn" class="active" onclick="switchLanguage('zh')">中文 🇨🇳</button>
        <button id="en-btn" onclick="switchLanguage('en')">English 🇺🇸</button>
    </div>

    <div class="test-section">
        <h2>📋 形状代码映射测试</h2>
        <div id="shape-badges"></div>
    </div>

    <div class="test-section">
        <h2>🎯 实际产品数据测试</h2>
        <div id="loading">正在加载产品数据...</div>
        <div id="product-grid" class="product-grid" style="display: none;"></div>
    </div>

    <div class="test-section">
        <h2>📊 形状分布统计</h2>
        <table id="stats-table" class="comparison-table">
            <thead>
                <tr>
                    <th>形状代码</th>
                    <th>中文名称</th>
                    <th>英文名称</th>
                    <th>产品数量</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="stats-body">
            </tbody>
        </table>
    </div>

    <script>
        // 形状映射配置（与Hook中保持一致）
        const shapeMapping = {
            'MEX': { name_zh: '气泡枕', name_en: 'Pillow' },
            'MEY': { name_zh: '开口气泡枕', name_en: 'Precut Air Pillow' },
            'MFB': { name_zh: '纸质气泡膜', name_en: 'paper Bubble' },
            'MFC': { name_zh: '气枕膜', name_en: 'Tube' },
            'MFF': { name_zh: '气泡膜', name_en: 'Bubble' },
            'MEX-PAPER': { name_zh: '纸质气垫枕', name_en: 'paper air Pillow' }
        };

        let currentLanguage = 'zh';
        let productsData = [];

        // 获取本地化形状名称
        function getLocalizedShapeName(shapeCode, language = 'zh') {
            const shapeInfo = shapeMapping[shapeCode];
            if (shapeInfo) {
                return language.startsWith('zh') ? shapeInfo.name_zh : shapeInfo.name_en;
            }
            return shapeCode;
        }

        // 切换语言
        function switchLanguage(lang) {
            currentLanguage = lang;
            document.getElementById('zh-btn').classList.toggle('active', lang === 'zh');
            document.getElementById('en-btn').classList.toggle('active', lang === 'en');
            
            renderShapeBadges();
            renderProducts();
            renderStats();
        }

        // 渲染形状标签
        function renderShapeBadges() {
            const container = document.getElementById('shape-badges');
            container.innerHTML = '';
            
            Object.keys(shapeMapping).forEach(shapeCode => {
                const shapeName = getLocalizedShapeName(shapeCode, currentLanguage);
                const badge = document.createElement('div');
                badge.className = 'spec-badge';
                badge.innerHTML = `
                    <div class="spec-label">形状</div>
                    <div class="spec-value">${shapeName}</div>
                `;
                container.appendChild(badge);
            });
        }

        // 渲染产品列表
        function renderProducts() {
            const container = document.getElementById('product-grid');
            container.innerHTML = '';
            
            productsData.slice(0, 6).forEach(product => {
                const shapeName = getLocalizedShapeName(product.shape, currentLanguage);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-title">${product.part_number}</div>
                    <div class="spec-badge">
                        <div class="spec-label">${currentLanguage === 'zh' ? '形状' : 'Shape'}</div>
                        <div class="spec-value">${shapeName}</div>
                    </div>
                    <div style="margin-top: 10px; font-size: 12px; color: #6c757d;">
                        原始值: ${product.shape}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 渲染统计表格
        function renderStats() {
            const tbody = document.getElementById('stats-body');
            tbody.innerHTML = '';
            
            // 统计形状分布
            const shapeStats = {};
            productsData.forEach(product => {
                const shape = product.shape || 'Unknown';
                shapeStats[shape] = (shapeStats[shape] || 0) + 1;
            });
            
            Object.entries(shapeStats).forEach(([shapeCode, count]) => {
                const zhName = getLocalizedShapeName(shapeCode, 'zh');
                const enName = getLocalizedShapeName(shapeCode, 'en');
                const hasMapping = shapeMapping[shapeCode] !== undefined;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><code>${shapeCode}</code></td>
                    <td>${zhName}</td>
                    <td>${enName}</td>
                    <td>${count}</td>
                    <td class="${hasMapping ? 'status-success' : 'status-warning'}">
                        ${hasMapping ? '✅ 已映射' : '⚠️ 未映射'}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 加载产品数据
        async function loadProductsData() {
            try {
                const response = await fetch('http://localhost:8080/wp-json/bjt/v1/consumables?limit=20');
                const data = await response.json();
                
                if (data.success && data.data.items) {
                    productsData = data.data.items.map(item => ({
                        id: item.id,
                        part_number: item.part_number,
                        shape: item.shape || item.bag_type || 'Unknown',
                        name: item.name
                    }));
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('product-grid').style.display = 'grid';
                    
                    renderProducts();
                    renderStats();
                    
                    console.log('✅ 产品数据加载成功:', productsData.length, '个产品');
                } else {
                    throw new Error('API返回数据格式错误');
                }
            } catch (error) {
                console.error('❌ 加载产品数据失败:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="status-error">
                        ❌ 加载失败: ${error.message}<br>
                        请确保后端服务正在运行 (http://localhost:8080)
                    </div>
                `;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderShapeBadges();
            loadProductsData();
            
            console.log('🌐 形状多语言显示测试页面已加载');
            console.log('📋 支持的形状映射:', shapeMapping);
        });
    </script>
</body>
</html>
