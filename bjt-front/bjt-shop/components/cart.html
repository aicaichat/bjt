<!-- Floating Cart Button -->
<div class="cart-icon" id="cart-toggle">
    <i class="icon">🛒</i>
    <div class="cart-count" id="cart-count">0</div>
</div>

<!-- Cart Preview Panel -->
<div class="cart-preview" id="cart-preview">
    <div class="cart-header">
        <div class="cart-title">购物车</div>
        <button class="close-cart" id="close-cart">×</button>
    </div>
    <div class="cart-items" id="cart-items">
        <!-- Cart items will be dynamically added here -->
        <div class="empty-cart-message" id="empty-cart-message">购物车为空</div>
    </div>
    <div class="cart-footer">
        <div class="cart-total">
            <span>合计：</span>
            <span id="cart-total">¥0.00</span>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <button id="clear-cart-btn" class="btn btn-danger">清空购物车</button>
            <button id="checkout-btn" class="btn btn-primary">结算</button>
        </div>
        
        <!-- Cart Confirmation Panel -->
        <div id="cart-confirm" class="cart-confirm">
            <div class="cart-confirm-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </div>
            <div class="cart-confirm-title">确认清空购物车</div>
            <div class="cart-confirm-text">此操作将清空购物车中所有商品，且无法恢复。</div>
            <div class="cart-confirm-buttons">
                <button id="cart-confirm-cancel" class="cart-confirm-button cart-confirm-cancel">取消</button>
                <button id="cart-confirm-proceed" class="cart-confirm-button cart-confirm-proceed">确认清空</button>
            </div>
        </div>
    </div>
</div>

<!-- Notification Template -->
<div class="notification" id="notification" style="display: none;">
    <span id="notification-message"></span>
</div>
