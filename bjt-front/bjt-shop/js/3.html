<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机床选择 - BLJ机械</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-bottom: 20px;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .product-image {
            height: 200px;
            object-fit: contain;
            padding: 15px;
        }
        .accessory-item {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .accessory-item.selected {
            border-color: #007bff;
            background-color: rgba(0,123,255,0.05);
        }
        .accessory-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-dropdown {
            min-width: 300px;
            max-height: 400px;
            overflow-y: auto;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <h1 class="h3 mb-0">BLJ机械</h1>
                </div>
                <div class="col-md-4">
                    <form class="d-flex">
                        <input class="form-control me-2" type="search" placeholder="搜索产品..." aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">搜索</button>
                    </form>
                </div>
                <div class="col-md-4 text-end">
                    <div class="dropdown d-inline-block position-relative">
                        <button class="btn btn-outline-light" type="button" id="cartDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cart"></i> 购物车
                            <span class="cart-badge" id="cartCount">0</span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end p-3 cart-dropdown" aria-labelledby="cartDropdown">
                            <div id="cartItems">
                                <p class="text-center text-muted">购物车为空</p>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <span>总计:</span>
                                <strong id="cartTotal">¥0.00</strong>
                            </div>
                            <div class="d-grid gap-2 mt-3">
                                <button class="btn btn-primary" id="checkoutBtn">结算</button>
                                <button class="btn btn-outline-secondary" id="clearCartBtn">清空购物车</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container my-5">
        <h2 class="mb-4">机床选择</h2>
        
        <!-- 产品列表 -->
        <div class="row" id="productContainer">
            <!-- 产品卡片将通过JavaScript动态加载 -->
        </div>

        <!-- 配件选择部分 -->
        <div class="mt-5 d-none" id="accessorySection">
            <h3>为您的机床选择配件</h3>
            <p class="text-muted">已选择: <span id="selectedMachine">未选择</span></p>
            
            <div class="row mt-4">
                <div class="col-lg-3">
                    <div class="list-group" id="accessoryTabs">
                        <a href="#" class="list-group-item list-group-item-action active" data-category="cooling">冷却系统</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="tools">刀具系统</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="measuring">测量系统</a>
                        <a href="#" class="list-group-item list-group-item-action" data-category="software">软件选项</a>
                    </div>
                </div>
                <div class="col-lg-9">
                    <div id="accessoryItems">
                        <!-- 配件项目将通过JavaScript动态加载 -->
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button class="btn btn-outline-secondary" id="backToMachines">返回机床选择</button>
                <button class="btn btn-primary" id="addToCartBtn">添加到购物车</button>
            </div>
        </div>
    </div>

    <!-- 吐司通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 产品详情模态框 -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">产品详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="productModalBody">
                    <!-- 产品详情将通过JavaScript动态加载 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="selectProductBtn">选择此机床</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4">
                    <h5>关于我们</h5>
                    <p>BLJ机械专注于提供高质量的机床和配件，为制造业提供全面解决方案。</p>
                </div>
                <div class="col-md-4">
                    <h5>联系我们</h5>
                    <p>电话: 400-123-4567<br>邮箱: info@blj-machinery.com</p>
                </div>
                <div class="col-md-4">
                    <h5>关注我们</h5>
                    <div>
                        <a href="#" class="text-white me-2"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="text-white me-2"><i class="bi bi-twitter"></i></a>
                        <a href="#" class="text-white me-2"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
                    </div>
                </div>
            </div>
            <hr>
            <p class="text-center mb-0">© 2023 BLJ机械 版权所有</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css"></script>
    <script src="data.js"></script>
    <script src="main.js"></script>
</body>
</html>
