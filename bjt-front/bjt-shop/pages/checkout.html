<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算 - BJT 产品管理系统</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <!-- Header Container -->
    <div id="header-container"></div>
    
    <!-- Main Content -->
    <main class="container">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="../index.html">首页</a> > 结算
        </div>
        
        <!-- Page Title -->
        <h1>订单结算</h1>
        
        <!-- Checkout Container -->
        <div class="checkout-container">
            <!-- Order Summary -->
            <div class="checkout-summary">
                <h3>订单摘要</h3>
                <div id="checkout-items">
                    <!-- Checkout items will be loaded dynamically -->
                    <div class="loading-spinner">加载中...</div>
                </div>
                
                <div class="checkout-total-row">
                    <span>总计：</span>
                    <span id="checkout-total" class="checkout-total">¥0.00</span>
                </div>
            </div>
            
            <!-- Checkout Form -->
            <div class="checkout-form-container">
                <h3>填写订单信息</h3>
                <form id="checkout-form" class="checkout-form">
                    <div class="form-section">
                        <h4>联系信息</h4>
                        <div class="form-group">
                            <label for="name" class="form-label">姓名</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>配送地址</h4>
                        <div class="form-group">
                            <label for="address" class="form-label">详细地址</label>
                            <input type="text" id="address" name="address" class="form-control" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city" class="form-label">城市</label>
                                <input type="text" id="city" name="city" class="form-control" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="zip" class="form-label">邮编</label>
                                <input type="text" id="zip" name="zip" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="country" class="form-label">国家/地区</label>
                            <select id="country" name="country" class="form-control" required>
                                <option value="China">中国</option>
                                <option value="USA">美国</option>
                                <option value="Japan">日本</option>
                                <option value="South Korea">韩国</option>
                                <option value="Singapore">新加坡</option>
                                <option value="Malaysia">马来西亚</option>
                                <option value="Australia">澳大利亚</option>
                                <option value="Germany">德国</option>
                                <option value="UK">英国</option>
                                <option value="France">法国</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h4>支付方式</h4>
                        <div class="form-group">
                            <div class="payment-methods">
                                <div class="payment-method">
                                    <input type="radio" id="payment-credit-card" name="payment-method" value="credit-card" checked>
                                    <label for="payment-credit-card">信用卡</label>
                                </div>
                                
                                <div class="payment-method">
                                    <input type="radio" id="payment-alipay" name="payment-method" value="alipay">
                                    <label for="payment-alipay">支付宝</label>
                                </div>
                                
                                <div class="payment-method">
                                    <input type="radio" id="payment-wechat" name="payment-method" value="wechat">
                                    <label for="payment-wechat">微信支付</label>
                                </div>
                                
                                <div class="payment-method">
                                    <input type="radio" id="payment-bank-transfer" name="payment-method" value="bank-transfer">
                                    <label for="payment-bank-transfer">银行转账</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <a href="../index.html" class="btn btn-secondary">继续购物</a>
                        <button type="submit" class="btn btn-primary">提交订单</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <!-- Footer Container -->
    <div id="footer-container"></div>
    
    <!-- JavaScript -->
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
