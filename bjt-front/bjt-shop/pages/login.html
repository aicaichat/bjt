<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BJT 产品管理系统</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <!-- Header Container - 改为id="header"与main.js一致 -->
    <header id="header"></header>
    
    <!-- Main Content -->
    <main class="container">
        <div class="login-container">
            <div class="login-box">
                <h2>用户登录</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">登录</button>
                        <a href="home.html" class="btn btn-secondary">返回首页</a>
                    </div>
                    <div class="form-footer">
                        <p>测试账号: admin / admin123</p>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <!-- Footer Container - 改为id="footer"与main.js一致 -->
    <footer id="footer"></footer>
    
    <!-- 通知容器 -->
    <div class="notification-container"></div>
    
    <!-- JavaScript - 按照正确的依赖顺序加载 -->
    <script src="../js/utils.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/theme-switcher.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Login page loaded');
            // 检查setupLoginForm函数是否存在并调用
            if (typeof setupLoginForm === 'function') {
                setupLoginForm();
            } else {
                console.error('setupLoginForm function not found!');
            }
        });
    </script>
</body>
</html>
