<!-- 订单完成页面 -->
<div class="order-complete-page">
    <h1 class="page-title">订单提交成功</h1>
    
    <!-- 进度指示器 -->
    <div class="progress-indicator">
        <div class="progress-bar"></div>
        <div class="progress-bar-active" style="width: 100%;"></div>
        
        <div class="progress-step">
            <div class="step-circle completed">✓</div>
            <div class="step-title">购物车</div>
        </div>
        
        <div class="progress-step">
            <div class="step-circle completed">✓</div>
            <div class="step-title">确认订单</div>
        </div>
        
        <div class="progress-step">
            <div class="step-circle completed">✓</div>
            <div class="step-title active">完成</div>
        </div>
    </div>
    
    <!-- 成功消息 -->
    <div class="success-message">
        <div class="success-icon">✓</div>
        <h2>您的订单已成功提交</h2>
        <p>订单号: <span id="order-number">ORD-20230001</span></p>
        <p>感谢您的购买，我们将尽快处理您的订单。</p>
    </div>
    
    <!-- 订单摘要 -->
    <div class="order-summary-card">
        <h3>订单摘要</h3>
        
        <div class="summary-details">
            <div class="summary-row">
                <div class="summary-label">订单日期:</div>
                <div class="summary-value" id="order-date"></div>
            </div>
            <div class="summary-row">
                <div class="summary-label">订单状态:</div>
                <div class="summary-value">已提交</div>
            </div>
            <div class="summary-row">
                <div class="summary-label">支付方式:</div>
                <div class="summary-value">线下付款</div>
            </div>
            <div class="summary-row">
                <div class="summary-label">总金额:</div>
                <div class="summary-value" id="order-total-amount">¥0.00</div>
            </div>
        </div>
    </div>
    
    <!-- 收货信息 -->
    <div class="shipping-info-card">
        <h3>收货信息</h3>
        
        <div class="info-details">
            <div class="info-row">
                <div class="info-label">联系人:</div>
                <div class="info-value" id="contact-name"></div>
            </div>
            <div class="info-row">
                <div class="info-label">电话:</div>
                <div class="info-value" id="contact-phone"></div>
            </div>
            <div class="info-row">
                <div class="info-label">邮箱:</div>
                <div class="info-value" id="contact-email"></div>
            </div>
            <div class="info-row">
                <div class="info-label">公司名称:</div>
                <div class="info-value" id="company-name"></div>
            </div>
            <div class="info-row">
                <div class="info-label">地址:</div>
                <div class="info-value" id="address"></div>
            </div>
        </div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="action-buttons">
        <button id="download-po" class="btn btn-secondary">下载PO订单</button>
        <button id="continue-shopping" class="btn btn-primary">继续购物</button>
    </div>
</div>
