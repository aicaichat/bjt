|------|------|----------|
| 1001 | 用户名或密码错误 | 401 |
| 1002 | 未授权访问 | 401 |
| 1003 | 无效的刷新令牌 | 401 |
| 2001 | 找不到指定的设备 | 404 |
| 3001 | 找不到指定的配件 | 404 |
| 4001 | 找不到指定的耗材 | 404 |
| 5001 | 找不到指定的备件 | 404 |
| 6001 | 无效的产品或数量 | 400 |
| 6002 | 购物车项不存在 | 404 |
| 7001 | 购物车为空，无法创建订单 | 400 |
| 7002 | 找不到指定的订单 | 404 |
| 7003 | 订单状态不允许取消 | 400 |
