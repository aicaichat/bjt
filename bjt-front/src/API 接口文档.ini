## 2. 认证接口

### 2.1 用户登录

用户登录并获取JWT令牌

**请求**:  
- 方法: `POST`
- 路径: `/auth/login`
- 认证: 不需要

**请求体**:
```json
{
  "username": "用户名",
  "password": "密码"
}
```

**成功响应** (状态码: 200):
```json
{
  "success": true,
  "data": {
    "token": "jwt_token_string",
    "expires_in": 86400,
    "user": {
      "id": 123,
      "username": "用户名",
      "email": "email@example.com",
      "name": "姓名",
      "role": "SALES",
      "region": "CN",
      "vipLevel": 2,
      "type": "vip"
    }
  }
}
```

**失败响应** (状态码: 401):
```json
{
  "success": false,
  "message": "用户名或密码错误",
  "code": 1001
}
```

### 2.2 获取当前用户信息

获取当前登录用户的详细信息

**请求**:  
- 方法: `GET`
- 路径: `/auth/me`
- 认证: 需要

**成功响应** (状态码: 200):
```json
{
  "success": true,
  "data": {
    "id": 123,
    "username": "用户名",
    "email": "email@example.com",
    "name": "姓名",
    "role": "SALES",
    "region": "CN",
    "vipLevel": 2,
    "type": "vip",
    "permissions": [
      "view_prices",
      "view_inventory",
      "add_to_cart"
    ]
  }
}
```

**失败响应** (状态码: 401):
```json
{
  "success": false,
  "message": "未授权访问",
  "code": 1002
}
```

### 2.3 刷新令牌

刷新JWT令牌以延长会话时间

**请求**:  
- 方法: `POST`
- 路径: `/auth/refresh`
- 认证: 需要（过期令牌也可以）

**成功响应** (状态码: 200):
```json
{
  "success": true,
  "data": {
    "token": "new_jwt_token_string",
    "expires_in": 86400
  }
}
```

**失败响应** (状态码: 401):
```json
{
  "success": false,
  "message": "无效的刷新令牌",
  "code": 1003
}
```

### 2.4 退出登录

使当前令牌失效，完成退出登录

**请求**:  
- 方法: `POST`
- 路径: `/auth/logout`
- 认证: 需要

**成功响应** (状态码: 200):
```json
{
  "success": true,
  "message": "已成功退出"
}
```

